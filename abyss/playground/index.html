<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyss &bull; Playground</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1254 1254'%3E%3Cpolygon points='564.2,313.5 692.1,313.5 975.0,939.5 854.0,939.5 627.9,436.3 392.2,939.5 270.6,939.5' fill='%23FFFFFF'/%3E%3Ccircle cx='626.3' cy='705.1' r='67.5' fill='%23FFFFFF'/%3E%3C/svg%3E" />
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <a href="/abyss" class="brand-link" aria-label="Abyss Home">
                    <svg class="brand-logo" viewBox="230 250 2750 740">
                        <defs>
                            <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
                                <feDropShadow dx="0" dy="1" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.16" />
                            </filter>
                            <style>
                                .abyss-glyph, .abyss-text {
                                    fill: #05070a;
                                }
                                .abyss-text {
                                    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                                    font-size: 710px;
                                    font-weight: 900;
                                    letter-spacing: 20px;
                                }
                                @media (prefers-color-scheme: dark) {
                                    .abyss-glyph, .abyss-text {
                                        fill: #FDFCFD;
                                    }
                                }
                            </style>
                        </defs>
                        <g filter="url(#soft-shadow)">
                            <g class="abyss-glyph">
                                <polygon points="550.0,313.5 702.0,313.5 975.0,939.5 820.0,939.5 626.0,468.0 425.0,939.5 270.0,939.5" />
                                <circle cx="626.0" cy="745.0" r="70.0" />
                            </g>
                            <text x="1060" y="939.5" class="abyss-text">BYSS</text>
                        </g>
                    </svg>
                </a>
                <nav class="header-nav">
                    <a href="/abyss/docs/">Docs</a>
                    <a href="https://github.com/jhosein58/abyss" target="_blank" rel="noopener">GitHub</a>
                </nav>
            </div>
            <div class="header-right">
                <div id="status-pill" class="status-pill loading">
                    <span class="status-dot"></span>
                    <span id="status-text">Loading Wasm</span>
                </div>
                <button id="run-btn" class="btn" title="Run (Ctrl+Enter)">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                        <polygon points="6 4 20 12 6 20 6 4"></polygon>
                    </svg>
                    <span>Run</span>
                    <kbd class="kbd-shortcut">Ctrl+↵</kbd>
                </button>
            </div>
        </header>

        <main class="workspace">
            <section class="panel editor-panel">
                <div class="panel-header">
                    <span class="panel-title">Source</span>
                    <div class="panel-actions">
                        <button id="copy-btn" class="icon-btn" title="Copy code">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <div id="line-numbers" class="line-numbers"></div>
                    <div class="editor-stage">
                        <pre id="editor-highlight" aria-hidden="true"><code id="editor-code"></code></pre>
                        <textarea id="code-editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
                    </div>
                </div>
            </section>

            <section class="panel terminal-panel">
                <div class="panel-header">
                    <span class="panel-title">Output</span>
                    <div class="panel-actions">
                        <span id="exec-time" class="exec-time"></span>
                        <button id="clear-btn" class="icon-btn" title="Clear console">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="terminal" class="terminal-body">
                    <pre id="output"></pre>
                </div>
            </section>
        </main>
    </div>
    <script src="../syntax.js"></script>
    <script src="app.js"></script>
</body>
</html>
