or inheritance. Instead, functions declared inside a `struct` serve as either:\n1. **Instance Methods**: Functions whose first parameter is `self &Self` (borrowed) or `self Self` (by-value).\n2. **Static Namespaced Functions**: Functions without a `self` parameter (commonly used for constructors).\n\n```abyss\nVector2 :: struct {\n    x f64\n    y f64\n\n    -- Static constructor (called as Vector2.new)\n    new :: fn(x f64, y f64) Self {\n        .{ x: x, y: y }\n    }\n\n    -- Static helper (called as Vector2.zero)\n    zero :: fn() Self {\n        .{ x: 0.0, y: 0.0 }\n    }\n\n    -- Instance method (called as v.length_sq())\n    length_sq :: fn(self &Self) f64 {\n        self.x * self.x + self.y * self.y\n    }\n}\n```\n\n### Calling Methods\n\nInstance methods are called using standard dot notation (`.`):\n\n```abyss\nv := Vector2.new(3.0, 4.0)\nsq := v.length_sq()\nprint(sq)\n```\n\nThe compiler automatically takes the address of `v` when calling a method that accepts `self &Self`. You never need to write `(&v).length_sq()`.\n\n---\n\n## 4. Function Pointers and Type Aliases\n\nFunctions in Abyss are first-class values. You can assign them to variables, pass them to other functions, or return them.\n\n### Function Type Signatures\n\nA function type is written as `fn(ParamTypes...) [ReturnType]`:\n\n```abyss\nTransformer :: fn(i32) i32\n```\n\nTop-level declarations without a body or `extern` keyword define **function type aliases**:\n\n```abyss\nBinaryOp :: fn(i32, i32) i32\nPredicate :: fn(i32) bool\n\napply :: fn(op BinaryOp, a i32, b i32) i32 {\n    op(a, b)\n}\n\nadd :: fn(x, y i32) i32 { x + y }\nsub :: fn(x, y i32) i32 { x - y }\n\nmain :: fn() {\n    print(apply(add, 10, 5))    -- 15\n    print(apply(sub, 10, 5))    -- 5\n}\n```\n\n---\n\n## 5. Generic Functions and Deferred Type Inference\n\nFunctions can accept generic type parameters. Abyss features a bidirectional type unification engine, meaning you rarely need to annotate generic parameters at the call site:\n\n```abyss\nidentity :: fn(val T) T {\n    val\n}\n\nmain :: fn() {\n    -- Inferred as i32\n    num := identity(42)\n\n    -- Inferred as Str\n    text := identity(\"Abyss\")\n\n    print(num)\n    print(text)\n}\n```\n\nThe compiler instantiates (monomorphizes) specialized native code for each concrete type used, guaranteeing zero runtime dispatch overhead.\n\n---\n\n## Idiomatic Summary\n\n| Concept | Idiomatic Abyss | Anti-Pattern |\n| :--- | :--- | :--- |\n| **No Return Value** | `log :: fn(msg Str) { ... }` | `log :: fn(msg Str) void` |\n| **Tail Expression** | `a + b` | `ret a + b` |\n| **Early Return** | `ret 0` | `return 0;` |\n| **Method Receiver** | `self &Self` | Explicit pointer unrolling |\n| **Method Call** | `item.process()` | `(&item).process()` |\n\n---\n\n[← Previous: Control Flow](02-control-flow.md) | [Next: Structs & Types →](04-structs-and-types.md)\n", "docs/03-the-guide/04-structs-and-types.md": "# Structs & Types: Data Layout, Constructors, and Generics\n\nIn Abyss, data is king. Abyss rejects bloated object models, hidden vtables, and inheritance chains in favor of clean, transparent structures whose layout directly matches physical memory.\n\nHere is a quick look at struct definition, instantiation, and generics:\n\n```abyss\n-- 1. Struct with clean field definitions and constructor\nPoint :: struct {\n    x, y i32\n\n    new :: fn(x i32, y i32) Self {\n        .{ x: x, y: y }\n    }\n}\n\n-- 2. Generic container struct\nBox :: struct(T type) {\n    value T\n\n    new :: fn(val T) Self {\n        .{ value: val }\n    }\n}\n\nmain :: fn() {\n    p := Point.new(10, 20)\n    b := Box().new(\"Wrapped text\")      -- Type inferred automatically\n\n    print(p.x)\n    print(b.value)\n}\n```\n\n---\n\n## 1. Struct Declaration and Field Syntax\n\nStructs are declared using `struct { ... }`. Fields are declared using the clean `name Type` syntax without colons:\n\n```abyss\nUser :: struct {\n    id        u64\n    name      Str\n    is_active bool\n}\n```\n\n### Grouped Fields\n\nFields sharing the same type can be declared together on a single line:\n\n```abyss\nColorRGBA :: struct {\n    r, g, b, a u8\n}\n```\n\n### Memory Layout Guarantees\n\nAbyss structs contain **only** the data fields you explicitly declare:\n- **No hidden pointers** (no vtables or class metadata).\n- **No implicit padding bytes** beyond standard natural alignment for the target architecture.\n- Passing or storing a struct is as cheap and predictable as in pure C.\n\n---\n\n## 2. Instantiation with Struct Literals (`.{ ... }`)\n\nStruct instances are created using anonymous literal syntax `.{ ... }`:\n\n```abyss\n-- Explicit type annotation with inferred literal:\np: Point = .{ x: 10, y: 20 }\n\n-- Field values can be expressions or variables:\norigin := Point.new(0, 0)\n```\n\n### Anonymous Structs\n\nYou can also create ad-hoc anonymous structs on the fly without a preceding nominal declaration:\n\n```abyss\nconfig := .{\n    host: \"127.0.0.1\",\n    port: 8080,\n    timeout_ms: 5000\n}\n\nprint(config.host)\nprint(config.port)\n```\n\n---\n\n## 3. The `Self` Alias\n\nWithin any struct declaration, `Self` serves as a convenient alias for the enclosing type. This avoids repeating lengthy type names in constructors and methods:\n\n```abyss\nCounter :: struct {\n    value i32\n\n    new :: fn() Self {\n        .{ value: 0 }\n    }\n\n    increment :: fn(self &Self) {\n        self.value = self.value + 1\n    }\n}\n```\n\n---\n\n## 4. Enums and Tagged Unions\n\nAbyss supports both simple enumerations and tagged unions with data payloads.\n\n### Enums\n\nEnums represent a closed set of named integral constants:\n\n```abyss\nDirection :: enum {\n    North\n    East\n    South\n    West\n}\n\nheading := Direction.North\n```\n\n### Tagged Unions\n\nUnions hold one of several possible data payloads accompanied by an internal discriminant tag:\n\n```abyss\nResult :: union {\n    Ok: i32\n    Err: Str\n}\n\nhandle_result :: fn(r Result) {\n    match r {\n        Result.Ok  => print(\"Success!\")\n        Result.Err => print(\"Failed!\")\n    }\n}\n```\n\n---\n\n## 5. Generics: Type Parameters and Deferred Inference\n\nTypes are first-class citizens in Abyss. Structs can be parameterized by types:\n\n```abyss\nPair :: struct(T type) {\n    first  T\n    second T\n\n    new :: fn(a T, b T) Self {\n        .{ first: a, second: b }\n    }\n}\n```\n\n### Deferred Inference\n\nAbyss features bidirectional type inference. When calling generic constructors, you can omit the type argument:\n\n```abyss\n-- The compiler infers T as i32 automatically:\nint_pair := Pair().new(10, 20)\n\n-- The compiler infers T as Str automatically:\nstr_pair := Pair().new(\"left\", \"right\")\n```\n\nThe compiler specializes a concrete native C struct for each distinct type argument used in your code.\n\n---\n\n## 6. Compile-Time Type Introspection (`@typeof`, `@type_name`)\n\nAbyss provides built-in compile-time intrinsics to inspect types:\n\n- `@typeof(expr)`: Evaluates to the compile-time type of an expression.\n- `@type_name(T)`: Evaluates to a compile-time `Str` representing the human-readable name of type `T`.\n\n```abyss\nx := 42\nprint(@type_name(@typeof(x)))   -- Prints: \"i32\"\n```\n\n---\n\n## Idiomatic Summary\n\n| Struct Feature | Idiomatic Abyss | Anti-Pattern |\n| :--- | :--- | :--- |\n| **Field Syntax** | `x i32` | `x: i32;` |\n| **Instantiation** | `.{ x: 10, y: 20 }` | `new Point(10, 20)` |\n| **Enclosing Type** | `Self` | Manually repeating struct name |\n| **Generic Call** | `Vec().new()` | `Vec(i32).new()` (when inferrable) |\n\n---\n\n[← Previous: Functions & Methods](03-functions-and-methods.md) | [Next: Pointers & Memory →](05-pointers-and-memory.md)\n", "03-the-guide/04-structs-and-types.md": "# Structs & Types: Data Layout, Constructors, and Generics\n\nIn Abyss, data is king. Abyss rejects bloated object models, hidden vtables, and inheritance chains in favor of clean, transparent structures whose layout directly matches physical memory.\n\nHere is a quick look at struct definition, instantiation, and generics:\n\n```abyss\n-- 1. Struct with clean field definitions and constructor\nPoint :: struct {\n    x, y i32\n\n    new :: fn(x i32, y i32) Self {\n        .{ x: x, y: y }\n    }\n}\n\n-- 2. Generic container struct\nBox :: struct(T type) {\n    value T\n\n    new :: fn(val T) Self {\n        .{ value: val }\n    }\n}\n\nmain :: fn() {\n    p := Point.new(10, 20)\n    b := Box().new(\"Wrapped text\")      -- Type inferred automatically\n\n    print(p.x)\n    print(b.value)\n}\n```\n\n---\n\n## 1. Struct Declaration and Field Syntax\n\nStructs are declared using `struct { ... }`. Fields are declared using the clean `name Type` syntax without colons:\n\n```abyss\nUser :: struct {\n    id        u64\n    name      Str\n    is_active bool\n}\n```\n\n### Grouped Fields\n\nFields sharing the same type can be declared together on a single line:\n\n```abyss\nColorRGBA :: struct {\n    r, g, b, a u8\n}\n```\n\n### Memory Layout Guarantees\n\nAbyss structs contain **only** the data fields you explicitly declare:\n- **No hidden pointers** (no vtables or class metadata).\n- **No implicit padding bytes** beyond standard natural alignment for the target architecture.\n- Passing or storing a struct is as cheap and predictable as in pure C.\n\n---\n\n## 2. Instantiation with Struct Literals (`.{ ... }`)\n\nStruct instances are created using anonymous literal syntax `.{ ... }`:\n\n```abyss\n-- Explicit type annotation with inferred literal:\np: Point = .{ x: 10, y: 20 }\n\n-- Field values can be expressions or variables:\norigin := Point.new(0, 0)\n```\n\n### Anonymous Structs\n\nYou can also create ad-hoc anonymous structs on the fly without a preceding nominal declaration:\n\n```abyss\nconfig := .{\n    host: \"127.0.0.1\",\n    port: 8080,\n    timeout_ms: 5000\n}\n\nprint(config.host)\nprint(config.port)\n```\n\n---\n\n## 3. The `Self` Alias\n\nWithin any struct declaration, `Self` serves as a convenient alias for the enclosing type. This avoids repeating lengthy type names in constructors and methods:\n\n```abyss\nCounter :: struct {\n    value i32\n\n    new :: fn() Self {\n        .{ value: 0 }\n    }\n\n    increment :: fn(self &Self) {\n        self.value = self.value + 1\n    }\n}\n```\n\n---\n\n## 4. Enums and Tagged Unions\n\nAbyss supports both simple enumerations and tagged unions with data payloads.\n\n### Enums\n\nEnums represent a closed set of named integral constants:\n\n```abyss\nDirection :: enum {\n    North\n    East\n    South\n    West\n}\n\nheading := Direction.North\n```\n\n### Tagged Unions\n\nUnions hold one of several possible data payloads accompanied by an internal discriminant tag:\n\n```abyss\nResult :: union {\n    Ok: i32\n    Err: Str\n}\n\nhandle_result :: fn(r Result) {\n    match r {\n        Result.Ok  => print(\"Success!\")\n        Result.Err => print(\"Failed!\")\n    }\n}\n```\n\n---\n\n## 5. Generics: Type Parameters and Deferred Inference\n\nTypes are first-class citizens in Abyss. Structs can be parameterized by types:\n\n```abyss\nPair :: struct(T type) {\n    first  T\n    second T\n\n    new :: fn(a T, b T) Self {\n        .{ first: a, second: b }\n    }\n}\n```\n\n### Deferred Inference\n\nAbyss features bidirectional type inference. When calling generic constructors, you can omit the type argument:\n\n```abyss\n-- The compiler infers T as i32 automatically:\nint_pair := Pair().new(10, 20)\n\n-- The compiler infers T as Str automatically:\nstr_pair := Pair().new(\"left\", \"right\")\n```\n\nThe compiler specializes a concrete native C struct for each distinct type argument used in your code.\n\n---\n\n## 6. Compile-Time Type Introspection (`@typeof`, `@type_name`)\n\nAbyss provides built-in compile-time intrinsics to inspect types:\n\n- `@typeof(expr)`: Evaluates to the compile-time type of an expression.\n- `@type_name(T)`: Evaluates to a compile-time `Str` representing the human-readable name of type `T`.\n\n```abyss\nx := 42\nprint(@type_name(@typeof(x)))   -- Prints: \"i32\"\n```\n\n---\n\n## Idiomatic Summary\n\n| Struct Feature | Idiomatic Abyss | Anti-Pattern |\n| :--- | :--- | :--- |\n| **Field Syntax** | `x i32` | `x: i32;` |\n| **Instantiation** | `.{ x: 10, y: 20 }` | `new Point(10, 20)` |\n| **Enclosing Type** | `Self` | Manually repeating struct name |\n| **Generic Call** | `Vec().new()` | `Vec(i32).new()` (when inferrable) |\n\n---\n\n[← Previous: Functions & Methods](03-functions-and-methods.md) | [Next: Pointers & Memory →](05-pointers-and-memory.md)\n", "docs/03-the-guide/05-pointers-and-memory.md": "# Pointers & Memory: Addresses, Auto-Deref, and Arenas\n\nAbyss is built for programmers who want full control over memory without clumsy, archaic C syntax. Memory in Abyss is explicit, transparent, and completely free of garbage collection pauses.\n\nHere is a quick look at pointer manipulation, seamless automatic dereferencing, and arena memory allocation:\n\n```abyss\nArena :: @import(\"std/allocator\").Arena\n\nNode :: struct {\n    value i32\n    next  &Node\n}\n\nmain :: fn() {\n    -- 1. Create a scoped memory arena\n    arena := Arena.new(4096)\n\n    -- 2. Allocate and link nodes\n    first := arena.alloc_type(Node)\n    first.value = 100           -- Seamless auto-deref!\n\n    second := arena.alloc_type(Node)\n    second.value = 200\n    first.next = second\n\n    print(first.next.value)     -- Auto-dereferences deeply (200)\n\n    -- 3. Free all allocations in one instant O(1) step\n    arena.destroy()\n}\n```\n\n---\n\n## 1. Pointers and Addresses (`&T`)\n\nA pointer represents the direct physical memory address of a value. In Abyss:\n- Pointer types are written as `&T` (a pointer to type `T`).\n- The address-of operator is `&`:\n\n```abyss\nx := 42\nptr: &i32 = &x          -- Takes the memory address of x\n```\n\nPointers are standard 64-bit machine addresses on 64-bit systems.\n\n---\n\n## 2. Automatic Dereference (Auto-Deref)\n\nOne of the most ergonomic features of Abyss is **deep automatic dereferencing**. \n\nIn C or C++, working with pointers requires cumbersome syntax like `(*ptr).field` or `ptr->field`. In Abyss, the dot operator (`.`) automatically and transparently dereferences pointers as deeply as necessary:\n\n```abyss\nUser :: struct {\n    id   u64\n    name Str\n}\n\nupdate_user :: fn(u &User) {\n    -- Write directly without asterisks or arrows:\n    u.id = 99\n    print(u.name)\n}\n```\n\n### Deep Pointer Chains\n\nAuto-dereferencing works cleanly across nested pointers and linked data structures:\n\n```abyss\n-- IDIOMATIC in Abyss:\nnode.next.next.value\n\n-- ANTI-PATTERN (never write this):\n(*(*(*node).next).next).value\n```\n\nYou write clean, readable code; the compiler emits the exact low-level pointer indirection instructions.\n\n---\n\n## 3. Pass-by-Value vs. Pass-by-Reference\n\nUnderstanding how data moves in memory is essential for writing high-performance systems code:\n\n- **Pass-by-Value (`fn(item Data)`)**: The compiler copies the bytes of the struct onto the call stack or into registers. This is ideal for small structs (scalars, `Point`, `Str`).\n- **Pass-by-Reference (`fn(item &Data)`)**: The compiler passes an 8-byte memory address. This is ideal for large structs to avoid copy overhead, or when the function needs to mutate the caller's data.\n\n```abyss\nPoint :: struct {\n    x, y i32\n\n    -- Mutates original instance via pointer\n    translate :: fn(self &Self, dx i32, dy i32) {\n        self.x = self.x + dx\n        self.y = self.y + dy\n    }\n}\n```\n\n---\n\n## 4. No Garbage Collection: The Arena Idiom\n\nGarbage collectors monitor memory at runtime, leading to unpredictable latency spikes and cache thrashing. Abyss has **no garbage collector**.\n\nInstead of hundreds of individual calls to `malloc` and `free`, idiomatic Abyss embraces **scoped arena allocation** (`std/allocator: Arena`):\n\n```abyss\nArena :: @import(\"std/allocator\").Arena\n\nprocess_request :: fn() {\n    -- Allocate a 64KB contiguous memory block\n    scratch := Arena.new(65536)\n\n    -- Allocate dynamic structures from the arena\n    temp_buffer := scratch.alloc(1024)\n    data := scratch.alloc_type(Point)\n    data.x = 10\n    data.y = 20\n\n    -- When the task is done, release everything instantly:\n    scratch.destroy()\n}\n```\n\n### Why Arenas Beat Garbage Collection:\n1. **$O(1)$ Allocation**: Allocating from an arena is just advancing a single pointer (bump allocation). It takes less than 3 CPU cycles.\n2. **$O(1)$ Deallocation**: Freeing an entire phase or request takes a single operation (`arena.destroy()`), regardless of whether you allocated 5 objects or 5,000,000.\n3. **Cache Locality**: Objects allocated sequentially sit next to each other in contiguous physical memory, keeping L1/L2 CPU caches warm.\n\n---\n\n## 5. Heap Objects and Lifecycle Management\n\nWhen using dynamic standard collections like `Vec(T)` or `HashMap(K, V)`, memory is managed explicitly via `.destroy()`:\n\n```abyss\nmain :: fn() {\n    list := Vec(i32).new()\n    list.push(10)\n    list.push(20)\n\n    print(list.len)\n\n    -- Free heap backing memory when finished\n    list.destroy()\n}\n```\n\n---\n\n## Idiomatic Summary\n\n| Operation | Idiomatic Abyss | Anti-Pattern |\n| :--- | :--- | :--- |\n| **Field Access** | `ptr.field` | `(*ptr).field` or `ptr->field` |\n| **Deep Access** | `a.b.c.d` | `(*(*a).b).c.d` |\n| **Phase Memory** | `scratch.destroy()` | Hundreds of individual `free()` calls |\n| **Collection Cleanup** | `vec.destroy()` | Leaking heap vectors |\n\n---\n\n[← Previous: Structs & Types](04-structs-and-types.md) | [Next: Comptime & Metaprogramming →](06-comptime-and-metaprogramming.md)\n", "03-the-guide/05-pointers-and-memory.md": "# Pointers & Memory: Addresses, Auto-Deref, and Arenas\n\nAbyss is built for programmers who want full control over memory without clumsy, archaic C syntax. Memory in Abyss is explicit, transparent, and completely free of garbage collection pauses.\n\nHere is a quick look at pointer manipulation, seamless automatic dereferencing, and arena memory allocation:\n\n```abyss\nArena :: @import(\"std/allocator\").Arena\n\nNode :: struct {\n    value i32\n    next  &Node\n}\n\nmain :: fn() {\n    -- 1. Create a scoped memory arena\n    arena := Arena.new(4096)\n\n    -- 2. Allocate and link nodes\n    first := arena.alloc_type(Node)\n    first.value = 100           -- Seamless auto-deref!\n\n    second := arena.alloc_type(Node)\n    second.value = 200\n    first.next = second\n\n    print(first.next.value)     -- Auto-dereferences deeply (200)\n\n    -- 3. Free all allocations in one instant O(1) step\n    arena.destroy()\n}\n```\n\n---\n\n## 1. Pointers and Addresses (`&T`)\n\nA pointer represents the direct physical memory address of a value. In Abyss:\n- Pointer types are written as `&T` (a pointer to type `T`).\n- The address-of operator is `&`:\n\n```abyss\nx := 42\nptr: &i32 = &x          -- Takes the memory address of x\n```\n\nPointers are standard 64-bit machine addresses on 64-bit systems.\n\n---\n\n## 2. Automatic Dereference (Auto-Deref)\n\nOne of the most ergonomic features of Abyss is **deep automatic dereferencing**. \n\nIn C or C++, working with pointers requires cumbersome syntax like `(*ptr).field` or `ptr->field`. In Abyss, the dot operator (`.`) automatically and transparently dereferences pointers as deeply as necessary:\n\n```abyss\nUser :: struct {\n    id   u64\n    name Str\n}\n\nupdate_user :: fn(u &User) {\n    -- Write directly without asterisks or arrows:\n    u.id = 99\n    print(u.name)\n}\n```\n\n### Deep Pointer Chains\n\nAuto-dereferencing works cleanly across nested pointers and linked data structures:\n\n```abyss\n-- IDIOMATIC in Abyss:\nnode.next.next.value\n\n-- ANTI-PATTERN (never write this):\n(*(*(*node).next).next).value\n```\n\nYou write clean, readable code; the compiler emits the exact low-level pointer indirection instructions.\n\n---\n\n## 3. Pass-by-Value vs. Pass-by-Reference\n\nUnderstanding how data moves in memory is essential for writing high-performance systems code:\n\n- **Pass-by-Value (`fn(item Data)`)**: The compiler copies the bytes of the struct onto the call stack or into registers. This is ideal for small structs (scalars, `Point`, `Str`).\n- **Pass-by-Reference (`fn(item &Data)`)**: The compiler passes an 8-byte memory address. This is ideal for large structs to avoid copy overhead, or when the function needs to mutate the caller's data.\n\n```abyss\nPoint :: struct {\n    x, y i32\n\n    -- Mutates original instance via pointer\n    translate :: fn(self &Self, dx i32, dy i32) {\n        self.x = self.x + dx\n        self.y = self.y + dy\n    }\n}\n```\n\n---\n\n## 4. No Garbage Collection: The Arena Idiom\n\nGarbage collectors monitor memory at runtime, leading to unpredictable latency spikes and cache thrashing. Abyss has **no garbage collector**.\n\nInstead of hundreds of individual calls to `malloc` and `free`, idiomatic Abyss embraces **scoped arena allocation** (`std/allocator: Arena`):\n\n```abyss\nArena :: @import(\"std/allocator\").Arena\n\nprocess_request :: fn() {\n    -- Allocate a 64KB contiguous memory block\n    scratch := Arena.new(65536)\n\n    -- Allocate dynamic structures from the arena\n    temp_buffer := scratch.alloc(1024)\n    data := scratch.alloc_type(Point)\n    data.x = 10\n    data.y = 20\n\n    -- When the task is done, release everything instantly:\n    scratch.destroy()\n}\n```\n\n### Why Arenas Beat Garbage Collection:\n1. **$O(1)$ Allocation**: Allocating from an arena is just advancing a single pointer (bump allocation). It takes less than 3 CPU cycles.\n2. **$O(1)$ Deallocation**: Freeing an entire phase or request takes a single operation (`arena.destroy()`), regardless of whether you allocated 5 objects or 5,000,000.\n3. **Cache Locality**: Objects allocated sequentially sit next to each other in contiguous physical memory, keeping L1/L2 CPU caches warm.\n\n---\n\n## 5. Heap Objects and Lifecycle Management\n\nWhen using dynamic standard collections like `Vec(T)` or `HashMap(K, V)`, memory is managed explicitly via `.destroy()`:\n\n```abyss\nmain :: fn() {\n    list := Vec(i32).new()\n    list.push(10)\n    list.push(20)\n\n    print(list.len)\n\n    -- Free heap backing memory when finished\n    list.destroy()\n}\n```\n\n---\n\n## Idiomatic Summary\n\n| Operation | Idiomatic Abyss | Anti-Pattern |\n| :--- | :--- | :--- |\n| **Field Access** | `ptr.field` | `(*ptr).field` or `ptr->field` |\n| **Deep Access** | `a.b.c.d` | `(*(*a).b).c.d` |\n| **Phase Memory** | `scratch.destroy()` | Hundreds of individual `free()` calls |\n| **Collection Cleanup** | `vec.destroy()` | Leaking heap vectors |\n\n---\n\n[← Previous: Structs & Types](04-structs-and-types.md) | [Next: Comptime & Metaprogramming →](06-comptime-and-metaprogramming.md)\n", "docs/03-the-guide/06-comptime-and-metaprogramming.md": "# Comptime & Metaprogramming: The VM, Splices, and Reflection\n\nIn many languages, metaprogramming requires clunky external code generators, Python pre-build scripts, or complex, unreadable macro languages. \n\nIn Abyss, **metaprogramming is just Abyss code**. The compiler contains an integrated bytecode VM that executes standard Abyss expressions during compilation, eliminating runtime overhead and enabling zero-cost abstractions.\n\nHere is a quick look at `cmpt` evaluation, string splices, and compile-time reflection:\n\n```abyss\n-- 1. Computed strictly at compile-time via the VM\nMAGIC_CONSTANT :: cmpt {\n    sum := 0\n    i := 1\n    while i <= 100 {\n        sum = sum + i\n        i = i + 1\n    }\n    sum                 -- Evaluates to 5050 at compile time\n}\n\n-- 2. Compile-time string splice (generates code dynamically)\n#`\ngenerated_multiplier :: fn(x i32) i32 {\n    x * 10\n}\n`\n\nmain :: fn() {\n    print(MAGIC_CONSTANT)\n    print(generated_multiplier(5))\n}\n```\n\n---\n\n## 1. Compile-Time Evaluation (`cmpt`)\n\nThe `cmpt` keyword marks a variable, block, or expression that must be evaluated at compile time on the compiler's integrated bytecode VM:\n\n```abyss\nFACTORIAL_10 :: cmpt {\n    fact :: fn(n u64) u64 {\n        if n <= 1 { 1 } else { n * fact(n - 1) }\n    }\n    fact(10)\n}\n```\n\n### Why `cmpt` Matters\n- **Zero Runtime Overhead**: Complex mathematical calculations, lookup tables, or validation checks run on the compiler's VM. The emitted C99 code simply contains the resulting constant literal.\n- **No Separate Macro Language**: You write standard Abyss syntax with standard loops, functions, and control flow.\n\n---\n\n## 2. String Splices (`#`)\n\nThe splice operator `#` takes a compile-time string expression, parses it as Abyss source code, and injects the resulting AST nodes directly into the program:\n\n```abyss\n-- Injecting an inline expression:\nmultiplier := #\"100\"\n\n-- Generating a declaration from a multiline template:\n#`\nPoint3D :: struct {\n    x, y, z f64\n}\n`\n```\n\n### Raw Multiline Strings (Backticks)\n\nAbyss supports raw multiline strings using backticks `` `...` ``. These preserve newlines and special characters without clumsy escape sequences, making them ideal for code-generation templates:\n\n```abyss\nmake_getter :: fn(cmpt field_name Str) Str {\n    -- Returns formatted source code string\n    `get_val :: fn() i32 { 42 }`\n}\n\n#make_getter(\"id\")\n```\n\n---\n\n## 3. Multi-Level Quotes (`##`, `###`)\n\nAbyss supports multi-level quote/unquote metaprogramming:\n- `#str` expands at compile-time.\n- `##str` delays expansion until the enclosing splice is processed.\n\nThis allows you to write high-order metaprograms—functions that generate code that in turn generates code—with complete lexical hygiene.\n\n---\n\n## 4. Compile-Time Reflection (`@type_info`)\n\nAbyss features first-class compile-time reflection via the `@type_info` intrinsic (available via the zero-import prelude):\n\n```abyss\nUser :: struct {\n    id   u64\n    name Str\n}\n\nmain :: fn() {\n    -- Introspect struct properties at compile-time\n    info := cmpt { @type_info(User) }\n\n    print(info.name)                    -- \"User\"\n    print(info.fields.len)              -- 2\n    print(info.fields.get(0).name)      -- \"id\"\n    print(info.fields.get(1).name)      -- \"name\"\n}\n```\n\n### Zero-Cost Serialization and Formatting\n\nBecause reflection can be executed inside `cmpt` blocks, you can inspect types to generate customized, specialized serialization routines (like JSON or binary packing) that compile directly to straight-line, branch-free C code with **zero runtime metadata** bundled into the binary.\n\n---\n\n## 5. Compile-Time Invariants and `#fall`\n\nCombine `cmpt` with `#fall` to enforce strict architectural constraints during compilation:\n\n```abyss\nfall :: @import(\"std/sys\").fall\n\ncmpt {\n    size := @type_info(User).size\n    if size > 64 {\n        -- Fails compilation with exact file and line location\n        #fall\n    }\n}\n```\n\n---\n\n## Idiomatic Summary\n\n| Metaprogramming | Idiomatic Abyss | Anti-Pattern |\n| :--- | :--- | :--- |\n| **Comptime Blocks** | `cmpt { ... }` | External pre-build Python scripts |\n| **Code Injection** | `#` and `#` `...` `` | Complex preprocessor macros |\n| **Type Inspection** | `@type_info(T)` | Runtime vtables or reflection tags |\n| **Static Assertions** | `cmpt { if bad { #fall } }` | Runtime crashes |\n\n---\n\n[← Previous: Pointers & Memory](05-pointers-and-memory.md) | [Next: C Interoperability & FFI →](07-c-interop.md)\n", "03-the-guide/06-comptime-and-metaprogramming.md": "# Comptime & Metaprogramming: The VM, Splices, and Reflection\n\nIn many languages, metaprogramming requires clunky external code generators, Python pre-build scripts, or complex, unreadable macro languages. \n\nIn Abyss, **metaprogramming is just Abyss code**. The compiler contains an integrated bytecode VM that executes standard Abyss expressions during compilation, eliminating runtime overhead and enabling zero-cost abstractions.\n\nHere is a quick look at `cmpt` evaluation, string splices, and compile-time reflection:\n\n```abyss\n-- 1. Computed strictly at compile-time via the VM\nMAGIC_CONSTANT :: cmpt {\n    sum := 0\n    i := 1\n    while i <= 100 {\n        sum = sum + i\n        i = i + 1\n    }\n    sum                 -- Evaluates to 5050 at compile time\n}\n\n-- 2. Compile-time string splice (generates code dynamically)\n#`\ngenerated_multiplier :: fn(x i32) i32 {\n    x * 10\n}\n`\n\nmain :: fn() {\n    print(MAGIC_CONSTANT)\n    print(generated_multiplier(5))\n}\n```\n\n---\n\n## 1. Compile-Time Evaluation (`cmpt`)\n\nThe `cmpt` keyword marks a variable, block, or expression that must be evaluated at compile time on the compiler's integrated bytecode VM:\n\n```abyss\nFACTORIAL_10 :: cmpt {\n    fact :: fn(n u64) u64 {\n        if n <= 1 { 1 } else { n * fact(n - 1) }\n    }\n    fact(10)\n}\n```\n\n### Why `cmpt` Matters\n- **Zero Runtime Overhead**: Complex mathematical calculations, lookup tables, or validation checks run on the compiler's VM. The emitted C99 code simply contains the resulting constant literal.\n- **No Separate Macro Language**: You write standard Abyss syntax with standard loops, functions, and control flow.\n\n---\n\n## 2. String Splices (`#`)\n\nThe splice operator `#` takes a compile-time string expression, parses it as Abyss source code, and injects the resulting AST nodes directly into the program:\n\n```abyss\n-- Injecting an inline expression:\nmultiplier := #\"100\"\n\n-- Generating a declaration from a multiline template:\n#`\nPoint3D :: struct {\n    x, y, z f64\n}\n`\n```\n\n### Raw Multiline Strings (Backticks)\n\nAbyss supports raw multiline strings using backticks `` `...` ``. These preserve newlines and special characters without clumsy escape sequences, making them ideal for code-generation templates:\n\n```abyss\nmake_getter :: fn(cmpt field_name Str) Str {\n    -- Returns formatted source code string\n    `get_val :: fn() i32 { 42 }`\n}\n\n#make_getter(\"id\")\n```\n\n---\n\n## 3. Multi-Level Quotes (`##`, `###`)\n\nAbyss supports multi-level quote/unquote metaprogramming:\n- `#str` expands at compile-time.\n- `##str` delays expansion until the enclosing splice is processed.\n\nThis allows you to write high-order metaprograms—functions that generate code that in turn generates code—with complete lexical hygiene.\n\n---\n\n## 4. Compile-Time Reflection (`@type_info`)\n\nAbyss features first-class compile-time reflection via the `@type_info` intrinsic (available via the zero-import prelude):\n\n```abyss\nUser :: struct {\n    id   u64\n    name Str\n}\n\nmain :: fn() {\n    -- Introspect struct properties at compile-time\n    info := cmpt { @type_info(User) }\n\n    print(info.name)                    -- \"User\"\n    print(info.fields.len)              -- 2\n    print(info.fields.get(0).name)      -- \"id\"\n    print(info.fields.get(1).name)      -- \"name\"\n}\n```\n\n### Zero-Cost Serialization and Formatting\n\nBecause reflection can be executed inside `cmpt` blocks, you can inspect types to generate customized, specialized serialization routines (like JSON or binary packing) that compile directly to straight-line, branch-free C code with **zero runtime metadata** bundled into the binary.\n\n---\n\n## 5. Compile-Time Invariants and `#fall`\n\nCombine `cmpt` with `#fall` to enforce strict architectural constraints during compilation:\n\n```abyss\nfall :: @import(\"std/sys\").fall\n\ncmpt {\n    size := @type_info(User).size\n    if size > 64 {\n        -- Fails compilation with exact file and line location\n        #fall\n    }\n}\n```\n\n---\n\n## Idiomatic Summary\n\n| Metaprogramming | Idiomatic Abyss | Anti-Pattern |\n| :--- | :--- | :--- |\n| **Comptime Blocks** | `cmpt { ... }` | External pre-build Python scripts |\n| **Code Injection** | `#` and `#` `...` `` | Complex preprocessor macros |\n| **Type Inspection** | `@type_info(T)` | Runtime vtables or reflection tags |\n| **Static Assertions** | `cmpt { if bad { #fall } }` | Runtime crashes |\n\n---\n\n[← Previous: Pointers & Memory](05-pointers-and-memory.md) | [Next: C Interoperability & FFI →](07-c-interop.md)\n", "docs/03-the-guide/07-c-interop.md": "# C Interoperability & Two-Way FFI\n\nAbyss does not lock you into a walled garden. Because Abyss compiles cleanly to standard ISO C99 and speaks the platform C ABI natively, interoperating with existing C libraries, operating system APIs, and graphics engines is first-class, transparent, and zero-cost.\n\nHere is a minimal program that calls standard C functions:\n\n```abyss\n-- 1. Declare external C functions\nputs :: extern fn(message &u8) i32\nc_abs :: extern \"abs\" fn(n i32) i32\n\nmain :: fn() {\n    -- Pass a null-terminated C string using c\"...\"\n    puts(c\"Hello from the C runtime!\")\n\n    -- Call external math function\n    print(c_abs(-42))           -- 42\n}\n```\n\n---\n\n## 1. Calling C Functions (`extern fn`)\n\nExternal C functions are declared at module scope using `extern fn` without a body:\n\n```abyss\nputs :: extern fn(s &u8) i32\n```\n\nBy default, the Abyss identifier (`puts`) is used as the C linker symbol name.\n\n### Custom Linker Names\n\nIf you want the Abyss binding to have a different name than the underlying C function, provide the C symbol name as a string literal after `extern`:\n\n```abyss\nc_cos :: extern \"cos\" fn(x f64) f64\nc_sqrt :: extern \"sqrt\" fn(x f64) f64\n```\n\n### Parameter Styles\n\nYou can name your parameters or provide only their types:\n\n```abyss\n-- Named parameters\nadd :: extern fn(a, b i32) i32\n\n-- Anonymous parameters (types only)\nmultiply :: extern fn(i32, i32) i32\n```\n\n### Passing Strings to C: `c\"...\"`\n\nWhile standard string literals `\"...\"` produce Abyss `Str` slices (`.{ ptr, len }`), C library APIs expect null-terminated byte pointers (`&u8`). \n\nUse `c\"...\"` to produce a null-terminated C string:\n\n```abyss\nputs(c\"A null-terminated C string\")\n```\n\nTo convert an existing Abyss `Str` to a C string at runtime, allocate a null-terminated buffer using an arena:\n\n```abyss\nArena :: @import(\"std/allocator\").Arena\n\nc_str := to_cstr(&scratch_arena, my_str)\nputs(c_str)\n```\n\n---\n\n## 2. Two-Way FFI: Exporting Abyss Functions to C\n\nAbyss supports **two-way interoperability**. You can write functions in Abyss and export them with unmangled C symbols so that foreign C code or shared libraries can call them directly:\n\n```abyss\n-- Exported with C linker symbol 'abyss_add'\nabyss_add :: extern fn(a, b i32) i32 {\n    a + b\n}\n\n-- Exported with custom C linker symbol 'my_custom_multiply'\ncompute :: extern \"my_custom_multiply\" fn(x i32, y i32) i32 {\n    x * y\n}\n```\n\nWhen building native code, the compiler emits standard, unmangled C function definitions adhering to the host platform's C calling conventions. When running on the Bytecode VM, these functions remain callable directly as bytecode routines.\n\n---\n\n## 3. C-Compatible Structs (`extern struct`)\n\nStandard Abyss structs may reorder fields to optimize alignment and reduce padding. When exchanging binary records with C, use `extern struct`:\n\n```abyss\nPoint :: extern struct {\n    x f64\n    y f64\n}\n\nPacketHeader :: extern struct {\n    magic u32\n    flags u16\n    tag   u8\n}\n```\n\n### Invariants of `extern struct`:\n1. **Strict Declaration Order**: Fields are never sorted or reordered; they appear in physical memory in the exact order declared.\n2. **Platform C ABI Alignment**: Follows standard platform C alignment and padding rules (e.g. System V AMD64 or Windows x64).\n3. **Zero-Cost Sharing**: Can be passed directly by value or by pointer (`&Point`) across C boundaries.\n\n---\n\n## 4. Native C Header Bindings\n\nWhen writing native code for hosted platforms, you can link directly against target C headers using bracket notation `[\"header.h\"]`:\n\n```abyss\n-- Bind to FILE type in stdio.h\nFile :: extern [\"stdio.h\"] \"FILE\" struct {}\ntmpfile :: extern [\"stdio.h\"] fn() &File\nfclose  :: extern [\"stdio.h\"] fn(&File) i32\n\n-- Bind to div_t and div in stdlib.h\nDivResult :: extern [\"stdlib.h\"] \"div_t\" struct {\n    quot i32\n    rem  i32\n}\n\ndivide :: extern [\"stdlib.h\"] \"div\" fn(i32, i32) DivResult\n```\n\n### Opaque Types and C `void *`\n\nAn empty `extern struct {}` creates an **opaque type**. This allows Abyss code to hold and pass pointers to C types whose internal representation is hidden (like `FILE *`).\n\nTo represent a generic C `void *`, define:\n\n```abyss\nVoid :: @typeof({})\nVoidPtr :: &Void\n```\n\n### Reading Header Constants and Macros (`@c_value`)\n\nUse `@c_value(header, name, T)` to read an integer macro, enum constant, or constant declared in a C header as a fixed-width integer:\n\n```abyss\nEOF_VALUE :: fn() i32 {\n    @c_value(\"stdio.h\", \"EOF\", i32)\n}\n```\n\n---\n\n## 5. Function Type Aliases and Callbacks\n\nYou can declare function signatures without `extern` and without a body to define **function type aliases**. These are useful for declaring callback signatures passed to C libraries:\n\n```abyss\n-- Define a callback function type alias\nCompareFn :: fn(a &Void, b &Void) i32\n\n-- Declare qsort from stdlib.h\nqsort :: extern [\"stdlib.h\"] fn(base &Void, num u64, size u64, cmp CompareFn)\n```\n\n---\n\n## 6. Running and Building with C Libraries\n\n### In Native Builds\n\nWhen you build your project using `sonar build` or compile emitted C with GCC/Clang:\n\n```sh\n# Emit C code and compile with external library (e.g. -lm for math)\nabyssc b main.a out.c\ngcc -O3 out.c -lm -o my_program\n./my_program\n```\n\n### In the Bytecode VM\n\nThe Abyss Bytecode VM includes an integrated dynamic bridge powered by `libffi`. It dynamically dispatches foreign C calls at runtime for standard scalar types, pointers, and structs:\n\n```sh\n# If calling a custom shared library:\ncc -shared -fPIC helper.c -o helper.so\nLD_PRELOAD=\"$PWD/helper.so\" abyssc r main.a\n```\n\n---\n\n## Idiomatic Summary\n\n| FFI Feature | Idiomatic Abyss | Purpose |\n| :--- | :--- | :--- |\n| **Import C function** | `puts :: extern fn(&u8) i32` | Call external C symbol |\n| **Custom linker symbol** | `sin :: extern \"sin\" fn(f64) f64` | Rename binding locally |\n| **Export Abyss to C** | `add :: extern fn(a, b i32) i32 { a + b }` | Expose unmangled symbol to C |\n| **C-compatible struct** | `Point :: extern struct { x, y f64 }` | Exact C ordering and alignment |\n| **Header binding** | `extern [\"stdio.h\"] ...` | Direct C prototype inclusion |\n| **Null-terminated string** | `c\"hello\"` | Produce `&u8` for C calls |\n\n---\n\n[← Previous: Comptime & Metaprogramming](06-comptime-and-metaprogramming.md) | [Next: Core Standard Library →](../04-reference/01-core.md)\n", "03-the-guide/07-c-interop.md": "# C Interoperability & Two-Way FFI\n\nAbyss does not lock you into a walled garden. Because Abyss compiles cleanly to standard ISO C99 and speaks the platform C ABI natively, interoperating with existing C libraries, operating system APIs, and graphics engines is first-class, transparent, and zero-cost.\n\nHere is a minimal program that calls standard C functions:\n\n```abyss\n-- 1. Declare external C functions\nputs :: extern fn(message &u8) i32\nc_abs :: extern \"abs\" fn(n i32) i32\n\nmain :: fn() {\n    -- Pass a null-terminated C string using c\"...\"\n    puts(c\"Hello from the C runtime!\")\n\n    -- Call external math function\n    print(c_abs(-42))           -- 42\n}\n```\n\n---\n\n## 1. Calling C Functions (`extern fn`)\n\nExternal C functions are declared at module scope using `extern fn` without a body:\n\n```abyss\nputs :: extern fn(s &u8) i32\n```\n\nBy default, the Abyss identifier (`puts`) is used as the C linker symbol name.\n\n### Custom Linker Names\n\nIf you want the Abyss binding to have a different name than the underlying C function, provide the C symbol name as a string literal after `extern`:\n\n```abyss\nc_cos :: extern \"cos\" fn(x f64) f64\nc_sqrt :: extern \"sqrt\" fn(x f64) f64\n```\n\n### Parameter Styles\n\nYou can name your parameters or provide only their types:\n\n```abyss\n-- Named parameters\nadd :: extern fn(a, b i32) i32\n\n-- Anonymous parameters (types only)\nmultiply :: extern fn(i32, i32) i32\n```\n\n### Passing Strings to C: `c\"...\"`\n\nWhile standard string literals `\"...\"` produce Abyss `Str` slices (`.{ ptr, len }`), C library APIs expect null-terminated byte pointers (`&u8`). \n\nUse `c\"...\"` to produce a null-terminated C string:\n\n```abyss\nputs(c\"A null-terminated C string\")\n```\n\nTo convert an existing Abyss `Str` to a C string at runtime, allocate a null-terminated buffer using an arena:\n\n```abyss\nArena :: @import(\"std/allocator\").Arena\n\nc_str := to_cstr(&scratch_arena, my_str)\nputs(c_str)\n```\n\n---\n\n## 2. Two-Way FFI: Exporting Abyss Functions to C\n\nAbyss supports **two-way interoperability**. You can write functions in Abyss and export them with unmangled C symbols so that foreign C code or shared libraries can call them directly:\n\n```abyss\n-- Exported with C linker symbol 'abyss_add'\nabyss_add :: extern fn(a, b i32) i32 {\n    a + b\n}\n\n-- Exported with custom C linker symbol 'my_custom_multiply'\ncompute :: extern \"my_custom_multiply\" fn(x i32, y i32) i32 {\n    x * y\n}\n```\n\nWhen building native code, the compiler emits standard, unmangled C function definitions adhering to the host platform's C calling conventions. When running on the Bytecode VM, these functions remain callable directly as bytecode routines.\n\n---\n\n## 3. C-Compatible Structs (`extern struct`)\n\nStandard Abyss structs may reorder fields to optimize alignment and reduce padding. When exchanging binary records with C, use `extern struct`:\n\n```abyss\nPoint :: extern struct {\n    x f64\n    y f64\n}\n\nPacketHeader :: extern struct {\n    magic u32\n    flags u16\n    tag   u8\n}\n```\n\n### Invariants of `extern struct`:\n1. **Strict Declaration Order**: Fields are never sorted or reordered; they appear in physical memory in the exact order declared.\n2. **Platform C ABI Alignment**: Follows standard platform C alignment and padding rules (e.g. System V AMD64 or Windows x64).\n3. **Zero-Cost Sharing**: Can be passed directly by value or by pointer (`&Point`) across C boundaries.\n\n---\n\n## 4. Native C Header Bindings\n\nWhen writing native code for hosted platforms, you can link directly against target C headers using bracket notation `[\"header.h\"]`:\n\n```abyss\n-- Bind to FILE type in stdio.h\nFile :: extern [\"stdio.h\"] \"FILE\" struct {}\ntmpfile :: extern [\"stdio.h\"] fn() &File\nfclose  :: extern [\"stdio.h\"] fn(&File) i32\n\n-- Bind to div_t and div in stdlib.h\nDivResult :: extern [\"stdlib.h\"] \"div_t\" struct {\n    quot i32\n    rem  i32\n}\n\ndivide :: extern [\"stdlib.h\"] \"div\" fn(i32, i32) DivResult\n```\n\n### Opaque Types and C `void *`\n\nAn empty `extern struct {}` creates an **opaque type**. This allows Abyss code to hold and pass pointers to C types whose internal representation is hidden (like `FILE *`).\n\nTo represent a generic C `void *`, define:\n\n```abyss\nVoid :: @typeof({})\nVoidPtr :: &Void\n```\n\n### Reading Header Constants and Macros (`@c_value`)\n\nUse `@c_value(header, name, T)` to read an integer macro, enum constant, or constant declared in a C header as a fixed-width integer:\n\n```abyss\nEOF_VALUE :: fn() i32 {\n    @c_value(\"stdio.h\", \"EOF\", i32)\n}\n```\n\n---\n\n## 5. Function Type Aliases and Callbacks\n\nYou can declare function signatures without `extern` and without a body to define **function type aliases**. These are useful for declaring callback signatures passed to C libraries:\n\n```abyss\n-- Define a callback function type alias\nCompareFn :: fn(a &Void, b &Void) i32\n\n-- Declare qsort from stdlib.h\nqsort :: extern [\"stdlib.h\"] fn(base &Void, num u64, size u64, cmp CompareFn)\n```\n\n---\n\n## 6. Running and Building with C Libraries\n\n### In Native Builds\n\nWhen you build your project using `sonar build` or compile emitted C with GCC/Clang:\n\n```sh\n# Emit C code and compile with external library (e.g. -lm for math)\nabyssc b main.a out.c\ngcc -O3 out.c -lm -o my_program\n./my_program\n```\n\n### In the Bytecode VM\n\nThe Abyss Bytecode VM includes an integrated dynamic bridge powered by `libffi`. It dynamically dispatches foreign C calls at runtime for standard scalar types, pointers, and structs:\n\n```sh\n# If calling a custom shared library:\ncc -shared -fPIC helper.c -o helper.so\nLD_PRELOAD=\"$PWD/helper.so\" abyssc r main.a\n```\n\n---\n\n## Idiomatic Summary\n\n| FFI Feature | Idiomatic Abyss | Purpose |\n| :--- | :--- | :--- |\n| **Import C function** | `puts :: extern fn(&u8) i32` | Call external C symbol |\n| **Custom linker symbol** | `sin :: extern \"sin\" fn(f64) f64` | Rename binding locally |\n| **Export Abyss to C** | `add :: extern fn(a, b i32) i32 { a + b }` | Expose unmangled symbol to C |\n| **C-compatible struct** | `Point :: extern struct { x, y f64 }` | Exact C ordering and alignment |\n| **Header binding** | `extern [\"stdio.h\"] ...` | Direct C prototype inclusion |\n| **Null-terminated string** | `c\"hello\"` | Produce `&u8` for C calls |\n\n---\n\n[← Previous: Comptime & Metaprogramming](06-comptime-and-metaprogramming.md) | [Next: Core Standard Library →](../04-reference/01-core.md)\n", "docs/04-reference/01-core.md": "# Core Reference: Foundation Primitives\n\nThe `core` pod is the foundational layer of the Abyss language ecosystem. It provides allocation-free data structures, string slice views, optional types, and compile-time reflection records.\n\nEvery symbol in `core/prelude` is automatically brought into scope in every Abyss source file—**no `@import` statement is required**.\n\n```abyss\nmain :: fn() {\n    -- 1. Allocation-free Str view\n    text: Str = \"Deep ocean\"\n    print(text.len)             -- 10\n\n    -- 2. Optional values with Maybe\n    opt := Maybe(i32).some(42)\n    if opt.is_some() {\n        print(opt.unwrap())     -- 42\n    }\n}\n```\n\n---\n\n## 1. Zero-Import Prelude Catalog\n\nThe following types and functions are automatically available across your entire codebase:\n\n| Type / Primitive | Purpose |\n| :--- | :--- |\n| `Str` | Allocation-free UTF-8 string slice (`.{ ptr: &u8, len: u64 }`). |\n| `Maybe(T)` | Type-safe optional container (`some`, `none`, `unwrap_or`). |\n| `Choice(T, E)` | Two-track result container for fallible operations. |\n| `Slice(T)` | Non-owning contiguous slice view over any array. |\n| `Range` | Half-open integer range iterator (`Range.new(0, 10)`). |\n| `Iterator` / `RefIterator` | Structural iteration protocol for `for in` loops. |\n| `SourceLocation` | Record for `@source_location()` (`file`, `line`, `column`). |\n| `TypeInfo`, `FieldInfo`, `TypeKind` | Type introspection records for `@type_info(T)`. |\n\n---\n\n## 2. `Str` (String Slice View)\n\nIn Abyss, strings are not null-terminated arrays; they are first-class slice views:\n\n```abyss\nStr :: struct {\n    ptr &u8\n    len u64\n}\n```\n\n### Key Operations & Methods\n\n- **Creation**:\n  ```abyss\n  s1 := \"Hello\"                 -- From literal\n  s2 := Str.of(c_ptr)           -- From null-terminated C string\n  ```\n- **Properties**:\n  ```abyss\n  length := s1.len              -- O(1) length inspection\n  ```\n- **Slicing & Substrings**:\n  ```abyss\n  sub := s1.slice(1, 4)         -- Returns Str view \"ell\"\n  ```\n- **Searching & Checking**:\n  ```abyss\n  has_prefix := s1.starts_with(\"He\")\n  has_suffix := s1.ends_with(\"lo\")\n  has_sub    := s1.contains(\"ell\")\n  ```\n- **Character Iteration**:\n  ```abyss\n  for ch in s1.chars() {\n      -- ch is an integer character code\n  }\n  ```\n\n---\n\n## 3. `Maybe(T)` (Optional Values)\n\n`Maybe(T)` is Abyss's type-safe alternative to null pointers and error sentinel codes (e.g. `-1`):\n\n```abyss\ndivide :: fn(a i32, b i32) Maybe(i32) {\n    if b == 0 {\n        ret Maybe(i32).none()\n    }\n    Maybe(i32).some(a / b)\n}\n```\n\n### Complete API Reference\n\n- `Maybe(T).some(value T) Self`: Constructs a `Maybe` holding a value.\n- `Maybe(T).none() Self`: Constructs an empty `Maybe`.\n- `self.is_some() bool`: Returns `true` if a value is present.\n- `self.is_none() bool`: Returns `true` if no value is present.\n- `self.unwrap() T`: Returns the inner value.\n- `self.unwrap_or(fallback T) T`: Returns the inner value if present; otherwise returns `fallback`.\n\n```abyss\nresult := divide(10, 0).unwrap_or(0)    -- Safe fallback: 0\n```\n\n---\n\n## 4. `Choice(T, E)` (Result / Error Handling)\n\n`Choice(T, E)` represents either a success value of type `T` or a failure value of type `E`:\n\n```abyss\nparse_port :: fn(port_str Str) Choice(u16, Str) {\n    if port_str.len == 0 {\n        ret Choice(u16, Str).err(\"Port string is empty\")\n    }\n    Choice(u16, Str).ok(8080)\n}\n```\n\n### Complete API Reference\n\n- `Choice(T, E).ok(val T) Self`: Constructs a success result.\n- `Choice(T, E).err(err E) Self`: Constructs an error result.\n- `self.is_ok() bool`: Returns `true` if operation succeeded.\n- `self.is_err() bool`: Returns `true` if operation failed.\n- `self.unwrap() T`: Returns the success value.\n- `self.unwrap_err() E`: Returns the error value.\n- `self.unwrap_or(fallback T) T`: Returns the success value or a fallback.\n\n---\n\n## 5. `Slice(T)` and `Range`\n\n`Slice(T)` represents a view over contiguous memory without taking ownership:\n\n```abyss\nSlice :: struct(T type) {\n    ptr &T\n    len u64\n}\n```\n\n### `Range`\n\n`Range` provides half-open iteration from `start` up to (but excluding) `end`:\n\n```abyss\nr := Range.new(0, 5)\nfor i in r {\n    print(i)                    -- Outputs: 0, 1, 2, 3, 4\n}\n```\n\n---\n\n## 6. Compile-Time Reflection Types\n\nIntrospecting types at compile time via `@type_info(T)` returns a `TypeInfo` struct:\n\n```abyss\nTypeInfo :: struct {\n    name   Str\n    size   u64\n    align  u64\n    kind   TypeKind\n    fields Slice(FieldInfo)\n}\n\nFieldInfo :: struct {\n    name   Str\n    offset u64\n    type   TypeInfo\n}\n```\n\n`TypeKind` is an enum identifying whether the type is an integer, float, pointer, struct, union, enum, or slice.\n\n---\n\n[← Previous: C Interoperability](../03-the-guide/07-c-interop.md) | [Next: Collections Reference →](02-collections.md)\n", "04-reference/01-core.md": "# Core Reference: Foundation Primitives\n\nThe `core` pod is the foundational layer of the Abyss language ecosystem. It provides allocation-free data structures, string slice views, optional types, and compile-time reflection records.\n\nEvery symbol in `core/prelude` is automatically brought into scope in every Abyss source file—**no `@import` statement is required**.\n\n```abyss\nmain :: fn() {\n    -- 1. Allocation-free Str view\n    text: Str = \"Deep ocean\"\n    print(text.len)             -- 10\n\n    -- 2. Optional values with Maybe\n    opt := Maybe(i32).some(42)\n    if opt.is_some() {\n        print(opt.unwrap())     -- 42\n    }\n}\n```\n\n---\n\n## 1. Zero-Import Prelude Catalog\n\nThe following types and functions are automatically available across your entire codebase:\n\n| Type / Primitive | Purpose |\n| :--- | :--- |\n| `Str` | Allocation-free UTF-8 string slice (`.{ ptr: &u8, len: u64 }`). |\n| `Maybe(T)` | Type-safe optional container (`some`, `none`, `unwrap_or`). |\n| `Choice(T, E)` | Two-track result container for fallible operations. |\n| `Slice(T)` | Non-owning contiguous slice view over any array. |\n| `Range` | Half-open integer range iterator (`Range.new(0, 10)`). |\n| `Iterator` / `RefIterator` | Structural iteration protocol for `for in` loops. |\n| `SourceLocation` | Record for `@source_location()` (`file`, `line`, `column`). |\n| `TypeInfo`, `FieldInfo`, `TypeKind` | Type introspection records for `@type_info(T)`. |\n\n---\n\n## 2. `Str` (String Slice View)\n\nIn Abyss, strings are not null-terminated arrays; they are first-class slice views:\n\n```abyss\nStr :: struct {\n    ptr &u8\n    len u64\n}\n```\n\n### Key Operations & Methods\n\n- **Creation**:\n  ```abyss\n  s1 := \"Hello\"                 -- From literal\n  s2 := Str.of(c_ptr)           -- From null-terminated C string\n  ```\n- **Properties**:\n  ```abyss\n  length := s1.len              -- O(1) length inspection\n  ```\n- **Slicing & Substrings**:\n  ```abyss\n  sub := s1.slice(1, 4)         -- Returns Str view \"ell\"\n  ```\n- **Searching & Checking**:\n  ```abyss\n  has_prefix := s1.starts_with(\"He\")\n  has_suffix := s1.ends_with(\"lo\")\n  has_sub    := s1.contains(\"ell\")\n  ```\n- **Character Iteration**:\n  ```abyss\n  for ch in s1.chars() {\n      -- ch is an integer character code\n  }\n  ```\n\n---\n\n## 3. `Maybe(T)` (Optional Values)\n\n`Maybe(T)` is Abyss's type-safe alternative to null pointers and error sentinel codes (e.g. `-1`):\n\n```abyss\ndivide :: fn(a i32, b i32) Maybe(i32) {\n    if b == 0 {\n        ret Maybe(i32).none()\n    }\n    Maybe(i32).some(a / b)\n}\n```\n\n### Complete API Reference\n\n- `Maybe(T).some(value T) Self`: Constructs a `Maybe` holding a value.\n- `Maybe(T).none() Self`: Constructs an empty `Maybe`.\n- `self.is_some() bool`: Returns `true` if a value is present.\n- `self.is_none() bool`: Returns `true` if no value is present.\n- `self.unwrap() T`: Returns the inner value.\n- `self.unwrap_or(fallback T) T`: Returns the inner value if present; otherwise returns `fallback`.\n\n```abyss\nresult := divide(10, 0).unwrap_or(0)    -- Safe fallback: 0\n```\n\n---\n\n## 4. `Choice(T, E)` (Result / Error Handling)\n\n`Choice(T, E)` represents either a success value of type `T` or a failure value of type `E`:\n\n```abyss\nparse_port :: fn(port_str Str) Choice(u16, Str) {\n    if port_str.len == 0 {\n        ret Choice(u16, Str).err(\"Port string is empty\")\n    }\n    Choice(u16, Str).ok(8080)\n}\n```\n\n### Complete API Reference\n\n- `Choice(T, E).ok(val T) Self`: Constructs a success result.\n- `Choice(T, E).err(err E) Self`: Constructs an error result.\n- `self.is_ok() bool`: Returns `true` if operation succeeded.\n- `self.is_err() bool`: Returns `true` if operation failed.\n- `self.unwrap() T`: Returns the success value.\n- `self.unwrap_err() E`: Returns the error value.\n- `self.unwrap_or(fallback T) T`: Returns the success value or a fallback.\n\n---\n\n## 5. `Slice(T)` and `Range`\n\n`Slice(T)` represents a view over contiguous memory without taking ownership:\n\n```abyss\nSlice :: struct(T type) {\n    ptr &T\n    len u64\n}\n```\n\n### `Range`\n\n`Range` provides half-open iteration from `start` up to (but excluding) `end`:\n\n```abyss\nr := Range.new(0, 5)\nfor i in r {\n    print(i)                    -- Outputs: 0, 1, 2, 3, 4\n}\n```\n\n---\n\n## 6. Compile-Time Reflection Types\n\nIntrospecting types at compile time via `@type_info(T)` returns a `TypeInfo` struct:\n\n```abyss\nTypeInfo :: struct {\n    name   Str\n    size   u64\n    align  u64\n    kind   TypeKind\n    fields Slice(FieldInfo)\n}\n\nFieldInfo :: struct {\n    name   Str\n    offset u64\n    type   TypeInfo\n}\n```\n\n`TypeKind` is an enum identifying whether the type is an integer, float, pointer, struct, union, enum, or slice.\n\n---\n\n[← Previous: C Interoperability](../03-the-guide/07-c-interop.md) | [Next: Collections Reference →](02-collections.md)\n", "docs/04-reference/02-collections.md": "# Collections Reference: Vectors, Maps, Sets, and Worklists\n\nThe Abyss standard library provides high-performance, flat-memory collections. Designed with mechanical sympathy, they keep allocations contiguous, maximize L1/L2 CPU cache hits, and avoid unnecessary pointer indirection.\n\nAll four core collections (`Vec`, `HashMap`, `HashSet`, `Worklist`) are provided by `std/prelude` and are **available without any `@import`**.\n\n```abyss\nmain :: fn() {\n    -- 1. Dynamic Vector\n    scores := Vec(i32).new()\n    scores.push(95)\n    scores.push(100)\n    print(scores.get(0))        -- 95\n\n    -- 2. Fast Linear-Probing Hash Map\n    lookup := HashMap(Str, i32).new()\n    lookup.put(\"port\", 8080)\n    print(lookup.get(\"port\").unwrap()) -- 8080\n\n    -- Explicit memory cleanup\n    scores.destroy()\n    lookup.destroy()\n}\n```\n\n---\n\n## 1. `Vec(T)` (Dynamic Array)\n\n`Vec(T)` is a dynamically growing contiguous array. It is the workhorse collection of idiomatic Abyss.\n\n### Complete API Reference\n\n- `Vec(T).new() Self`: Creates a new vector with default initial capacity (4).\n- `Vec(T).with_cap(initial_cap u64) Self`: Allocates a vector with pre-reserved capacity to avoid reallocations.\n- `self.push(val T)`: Appends an element to the end ($O(1)$ amortized).\n- `self.pop() Maybe(T)`: Removes and returns the last element, or `none()` if empty.\n- `self.get(idx u64) T`: Returns the element at `idx` by value.\n- `self.get_ptr(idx u64) &T`: Returns a direct pointer to the element at `idx` (avoids copying large structs).\n- `self.set(idx u64, val T)`: Overwrites the element at `idx`.\n- `self.reserve(additional u64)`: Ensures space for at least `additional` more elements.\n- `self.clear()`: Resets length to 0 without freeing allocated memory.\n- `self.destroy()`: Frees backing heap memory.\n\n### Iterating Over a `Vec`\n\n```abyss\nnames := Vec(Str).new()\nnames.push(\"Alice\")\nnames.push(\"Bob\")\n\nfor name in names {\n    print(name)\n}\n\nnames.destroy()\n```\n\n---\n\n## 2. `HashMap(K, V)` (Associative Map)\n\n`HashMap(K, V)` is an open-addressing, linear-probing hash table utilizing a fast FNV-1a hash function. Keys and values are stored in parallel contiguous arrays to prevent pointer-chasing cache misses.\n\n### Complete API Reference\n\n- `HashMap(K, V).new() Self`: Creates a map with default initial capacity (16).\n- `HashMap(K, V).with_cap(cap u64) Self`: Creates a map with pre-allocated capacity.\n- `self.put(key K, val V)`: Inserts or updates an entry.\n- `self.get(key K) Maybe(V)`: Retrieves a value by key.\n- `self.get_ptr(key K) Maybe(&V)`: Retrieves a pointer to the value inside the map for in-place mutation.\n- `self.contains(key K) bool`: Checks whether a key is present ($O(1)$ average).\n- `self.remove(key K) bool`: Removes an entry by key; returns `true` if found.\n- `self.clear()`: Resets all entries without freeing capacity.\n- `self.destroy()`: Frees all allocated memory.\n\n```abyss\nages := HashMap(Str, u32).new()\nages.put(\"Alice\", 28)\n\nif ages.contains(\"Alice\") {\n    age := ages.get(\"Alice\").unwrap()\n    print(age)\n}\n\nages.destroy()\n```\n\n---\n\n## 3. `HashSet(T)` (Unique Set)\n\n`HashSet(T)` maintains a collection of unique elements with $O(1)$ lookup and insertion. It shares the open-addressing architecture of `HashMap`.\n\n### Complete API Reference\n\n- `HashSet(T).new() Self`: Creates an empty set.\n- `HashSet(T).with_cap(cap u64) Self`: Creates a set with pre-allocated capacity.\n- `self.insert(val T) bool`: Inserts `val`; returns `true` if the element was new.\n- `self.contains(val T) bool`: Checks if `val` is present.\n- `self.remove(val T) bool`: Removes `val`; returns `true` if it was present.\n- `self.clear()`: Resets length to 0.\n- `self.destroy()`: Frees backing memory.\n\n```abyss\nseen := HashSet(i32).new()\nseen.insert(42)\nseen.insert(42)                  -- Ignored (duplicate)\nprint(seen.len)                  -- 1\nseen.destroy()\n```\n\n---\n\n## 4. `Worklist(T)` (Queue / Traversal Stack)\n\n`Worklist(T)` is a specialized high-performance collection designed for graph traversals, compiler passes, and task queues:\n\n- `Worklist(T).new() Self`: Creates a new worklist.\n- `self.push(item T)`: Pushes a task/item into the worklist.\n- `self.pop() Maybe(T)`: Pops the next task for processing.\n- `self.destroy()`: Frees backing memory.\n\n---\n\n## 5. Memory Ownership and Cleanup Rule\n\nBecause Abyss has no garbage collector, dynamic collections allocate memory directly from the system heap (`malloc`). \n\nWhenever a function or struct finishes using a collection, call its `.destroy()` method to release backing memory:\n\n```abyss\nprocess_items :: fn() {\n    list := Vec(i32).new()\n    -- work with list...\n    list.destroy()              -- Prevents memory leaks\n}\n```\n\n---\n\n[← Previous: Core Reference](01-core.md) | [Next: I/O & Formatting Reference →](03-io-and-fmt.md)\n", "04-reference/02-collections.md": "# Collections Reference: Vectors, Maps, Sets, and Worklists\n\nThe Abyss standard library provides high-performance, flat-memory collections. Designed with mechanical sympathy, they keep allocations contiguous, maximize L1/L2 CPU cache hits, and avoid unnecessary pointer indirection.\n\nAll four core collections (`Vec`, `HashMap`, `HashSet`, `Worklist`) are provided by `std/prelude` and are **available without any `@import`**.\n\n```abyss\nmain :: fn() {\n    -- 1. Dynamic Vector\n    scores := Vec(i32).new()\n    scores.push(95)\n    scores.push(100)\n    print(scores.get(0))        -- 95\n\n    -- 2. Fast Linear-Probing Hash Map\n    lookup := HashMap(Str, i32).new()\n    lookup.put(\"port\", 8080)\n    print(lookup.get(\"port\").unwrap()) -- 8080\n\n    -- Explicit memory cleanup\n    scores.destroy()\n    lookup.destroy()\n}\n```\n\n---\n\n## 1. `Vec(T)` (Dynamic Array)\n\n`Vec(T)` is a dynamically growing contiguous array. It is the workhorse collection of idiomatic Abyss.\n\n### Complete API Reference\n\n- `Vec(T).new() Self`: Creates a new vector with default initial capacity (4).\n- `Vec(T).with_cap(initial_cap u64) Self`: Allocates a vector with pre-reserved capacity to avoid reallocations.\n- `self.push(val T)`: Appends an element to the end ($O(1)$ amortized).\n- `self.pop() Maybe(T)`: Removes and returns the last element, or `none()` if empty.\n- `self.get(idx u64) T`: Returns the element at `idx` by value.\n- `self.get_ptr(idx u64) &T`: Returns a direct pointer to the element at `idx` (avoids copying large structs).\n- `self.set(idx u64, val T)`: Overwrites the element at `idx`.\n- `self.reserve(additional u64)`: Ensures space for at least `additional` more elements.\n- `self.clear()`: Resets length to 0 without freeing allocated memory.\n- `self.destroy()`: Frees backing heap memory.\n\n### Iterating Over a `Vec`\n\n```abyss\nnames := Vec(Str).new()\nnames.push(\"Alice\")\nnames.push(\"Bob\")\n\nfor name in names {\n    print(name)\n}\n\nnames.destroy()\n```\n\n---\n\n## 2. `HashMap(K, V)` (Associative Map)\n\n`HashMap(K, V)` is an open-addressing, linear-probing hash table utilizing a fast FNV-1a hash function. Keys and values are stored in parallel contiguous arrays to prevent pointer-chasing cache misses.\n\n### Complete API Reference\n\n- `HashMap(K, V).new() Self`: Creates a map with default initial capacity (16).\n- `HashMap(K, V).with_cap(cap u64) Self`: Creates a map with pre-allocated capacity.\n- `self.put(key K, val V)`: Inserts or updates an entry.\n- `self.get(key K) Maybe(V)`: Retrieves a value by key.\n- `self.get_ptr(key K) Maybe(&V)`: Retrieves a pointer to the value inside the map for in-place mutation.\n- `self.contains(key K) bool`: Checks whether a key is present ($O(1)$ average).\n- `self.remove(key K) bool`: Removes an entry by key; returns `true` if found.\n- `self.clear()`: Resets all entries without freeing capacity.\n- `self.destroy()`: Frees all allocated memory.\n\n```abyss\nages := HashMap(Str, u32).new()\nages.put(\"Alice\", 28)\n\nif ages.contains(\"Alice\") {\n    age := ages.get(\"Alice\").unwrap()\n    print(age)\n}\n\nages.destroy()\n```\n\n---\n\n## 3. `HashSet(T)` (Unique Set)\n\n`HashSet(T)` maintains a collection of unique elements with $O(1)$ lookup and insertion. It shares the open-addressing architecture of `HashMap`.\n\n### Complete API Reference\n\n- `HashSet(T).new() Self`: Creates an empty set.\n- `HashSet(T).with_cap(cap u64) Self`: Creates a set with pre-allocated capacity.\n- `self.insert(val T) bool`: Inserts `val`; returns `true` if the element was new.\n- `self.contains(val T) bool`: Checks if `val` is present.\n- `self.remove(val T) bool`: Removes `val`; returns `true` if it was present.\n- `self.clear()`: Resets length to 0.\n- `self.destroy()`: Frees backing memory.\n\n```abyss\nseen := HashSet(i32).new()\nseen.insert(42)\nseen.insert(42)                  -- Ignored (duplicate)\nprint(seen.len)                  -- 1\nseen.destroy()\n```\n\n---\n\n## 4. `Worklist(T)` (Queue / Traversal Stack)\n\n`Worklist(T)` is a specialized high-performance collection designed for graph traversals, compiler passes, and task queues:\n\n- `Worklist(T).new() Self`: Creates a new worklist.\n- `self.push(item T)`: Pushes a task/item into the worklist.\n- `self.pop() Maybe(T)`: Pops the next task for processing.\n- `self.destroy()`: Frees backing memory.\n\n---\n\n## 5. Memory Ownership and Cleanup Rule\n\nBecause Abyss has no garbage collector, dynamic collections allocate memory directly from the system heap (`malloc`). \n\nWhenever a function or struct finishes using a collection, call its `.destroy()` method to release backing memory:\n\n```abyss\nprocess_items :: fn() {\n    list := Vec(i32).new()\n    -- work with list...\n    list.destroy()              -- Prevents memory leaks\n}\n```\n\n---\n\n[← Previous: Core Reference](01-core.md) | [Next: I/O & Formatting Reference →](03-io-and-fmt.md)\n", "docs/04-reference/03-io-and-fmt.md": "# I/O & Formatting Reference: `print`, `printf`, and `std/fmt`\n\nAbyss provides a dual-layer I/O and text formatting system:\n1. **High-Level Console I/O**: `print`, `write`, and `printf` (provided automatically via `std/prelude`).\n2. **Zero-Cost Compile-Time Formatter**: `std/fmt` (`fmt`, `fmt_into`, `Fmt`), which parses and specializes format templates at compile time to eliminate runtime parsing overhead.\n\n```abyss\nmain :: fn() {\n    -- 1. print appends an automatic trailing newline\n    print(\"Welcome to Abyss!\")\n\n    -- 2. write outputs without a trailing newline\n    write(\"[\")\n    write(\"OK\")\n    print(\"]\")                  -- Outputs: [OK]\n\n    -- 3. printf formats compile-time templates\n    printf(\"Position: ({}, {})\\n\", .{10, 20})\n}\n```\n\n---\n\n## 1. Standard Output: `print`, `write`, `printf`\n\n### `print(value)`\n\nFormats `value` and automatically outputs a **trailing newline (`\\n`)**. It functions like `println` in other languages:\n\n```abyss\nprint(42)\nprint(\"A string\")\nprint(true)\n```\n\n> **Important**: Never append `\\n` to a `print` call (e.g. `print(\"text\\n\")`), or you will produce an extra blank line.\n\n### `write(value)`\n\nFormats and outputs `value` **without** a trailing newline. Use `write` for continuous line construction, inline prompts, or progress indicators:\n\n```abyss\nwrite(\"Loading\")\nwrite(\".\")\nwrite(\".\")\nprint(\" Done!\")                 -- Outputs: Loading.. Done!\n```\n\n### `printf(pattern, args)`\n\nFormats `args` according to a compile-time `pattern` string without an automatic trailing newline:\n\n```abyss\nx := 100\ny := 200\nprintf(\"Coordinates: x={}, y={}\\n\", .{x, y})\n```\n\n---\n\n## 2. Compile-Time Formatter (`std/fmt`)\n\nThe `std/fmt` module provides zero-cost text construction into memory buffers. Because format patterns are evaluated at compile time:\n- There is **zero runtime parsing** of format strings.\n- Format arguments are strictly type-checked at compile time.\n- Emitted code compiles to direct, inline byte writes.\n\n```abyss\nformat :: @import(\"std/fmt\")\nArena :: @import(\"std/allocator\").Arena\n\nbuild_query :: fn(arena &Arena, table Str, id u32) Str {\n    -- Specializes template at compile time\n    query := format.fmt(arena, \"SELECT * FROM {} WHERE id = {};\", .{table, id})\n    query.as_str()\n}\n```\n\n### `fmt` vs `fmt_into`\n\n- `format.fmt(arena, pattern, args)`: Allocates and returns a fresh `String` in the provided arena.\n- `format.fmt_into(&buffer, pattern, args)`: Appends the formatted output directly into an existing `String` buffer without intermediate allocations:\n\n```abyss\narena := Arena.new(4096)\nout := format.fmt(&arena, \"Header: {}\\n\", .{\"Start\"})\nformat.fmt_into(&out, \"Body: {}\\n\", .{\"Data\"})\nformat.fmt_into(&out, \"Footer: {}\\n\", .{\"End\"})\nprint(out.as_str())\narena.destroy()\n```\n\n---\n\n## 3. String Construction (`String`)\n\nFor manual text assembly without templates, use `String` from `std/string`:\n\n```abyss\nString :: @import(\"std/string\").String\nArena :: @import(\"std/allocator\").Arena\n\nmain :: fn() {\n    arena := Arena.new(1024)\n    s := String.new(&arena)\n\n    s.push_str(\"Hello\")\n    s.push_char(' ')\n    s.push_str(\"World\")\n    s.push_u32(2026)\n\n    print(s.as_str())           -- \"Hello World2026\"\n    arena.destroy()\n}\n```\n\n---\n\n## 4. ANSI Terminal Colors (`std/fmt: escape`)\n\n`std/fmt` includes a zero-allocation ANSI escape table for styling terminal output:\n\n```abyss\nfmt :: @import(\"std/fmt\")\n\nmain :: fn() {\n    esc := fmt.escape()\n\n    printf(\"{}{}{} success\\n\", .{esc.fg_green, esc.bold, esc.reset})\n    printf(\"{}{}Warning:{}\\n\", .{esc.fg_yellow, esc.underline, esc.reset})\n}\n```\n\n---\n\n[← Previous: Collections](02-collections.md) | [Next: Filesystem & Paths Reference →](04-fs-and-path.md)\n", "04-reference/03-io-and-fmt.md": "# I/O & Formatting Reference: `print`, `printf`, and `std/fmt`\n\nAbyss provides a dual-layer I/O and text formatting system:\n1. **High-Level Console I/O**: `print`, `write`, and `printf` (provided automatically via `std/prelude`).\n2. **Zero-Cost Compile-Time Formatter**: `std/fmt` (`fmt`, `fmt_into`, `Fmt`), which parses and specializes format templates at compile time to eliminate runtime parsing overhead.\n\n```abyss\nmain :: fn() {\n    -- 1. print appends an automatic trailing newline\n    print(\"Welcome to Abyss!\")\n\n    -- 2. write outputs without a trailing newline\n    write(\"
