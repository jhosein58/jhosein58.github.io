ing` buffer without intermediate allocations:\n\n```abyss\narena := Arena.new(4096)\nout := format.fmt(&arena, \"Header: {}\\n\", .{\"Start\"})\nformat.fmt_into(&out, \"Body: {}\\n\", .{\"Data\"})\nformat.fmt_into(&out, \"Footer: {}\\n\", .{\"End\"})\nprint(out.as_str())\narena.destroy()\n```\n\n---\n\n## 3. String Construction (`String`)\n\nFor manual text assembly without templates, use `String` from `std/string`:\n\n```abyss\nString :: @import(\"std/string\").String\nArena :: @import(\"std/allocator\").Arena\n\nmain :: fn() {\n    arena := Arena.new(1024)\n    s := String.new(&arena)\n\n    s.push_str(\"Hello\")\n    s.push_char(' ')\n    s.push_str(\"World\")\n    s.push_u32(2026)\n\n    print(s.as_str())           -- \"Hello World2026\"\n    arena.destroy()\n}\n```\n\n---\n\n## 4. ANSI Terminal Colors (`std/fmt: escape`)\n\n`std/fmt` includes a zero-allocation ANSI escape table for styling terminal output:\n\n```abyss\nfmt :: @import(\"std/fmt\")\n\nmain :: fn() {\n    esc := fmt.escape()\n\n    printf(\"{}{}{} success\\n\", .{esc.fg_green, esc.bold, esc.reset})\n    printf(\"{}{}Warning:{}\\n\", .{esc.fg_yellow, esc.underline, esc.reset})\n}\n```\n\n---\n\n[← Previous: Collections](02-collections.md) | [Next: Filesystem & Paths Reference →](04-fs-and-path.md)\n", "docs/04-reference/04-fs-and-path.md": "# Filesystem & Paths Reference: `std/fs` and `std/path`\n\nThe `std/fs` and `std/path` modules provide clean, cross-platform file system operations. They operate natively on Abyss's allocation-free `Str` type and integrate seamlessly with `Arena` memory management.\n\n```abyss\nFile :: @import(\"std/fs\").File\nPath :: @import(\"std/path\").Path\nArena :: @import(\"std/allocator\").Arena\n\nmain :: fn() {\n    arena := Arena.new(65536)\n\n    -- 1. Combine paths portably\n    log_path := Path.join(&arena, \"logs\", \"app.log\")\n\n    -- 2. Write content directly\n    File.write_string(log_path, \"Application started\\n\")\n\n    -- 3. Read content into an arena\n    opt := File.read_to_string(&arena, log_path)\n    if opt.is_some() {\n        print(opt.unwrap())\n    }\n\n    arena.destroy()\n}\n```\n\n---\n\n## 1. High-Level File Operations (`File`)\n\nThe static `File` struct provides convenient single-call functions for reading, writing, and inspecting files:\n\n### Reading Files\n\n- `File.read_to_string(arena &Arena, path Str) Maybe(Str)`:  \n  Reads the entire contents of a file into memory allocated within `arena`. Returns `none()` if the file does not exist or cannot be read.\n\n```abyss\nopt := File.read_to_string(&scratch, \"config.json\")\nif opt.is_some() {\n    content := opt.unwrap()\n    print(content)\n}\n```\n\n### Writing & Appending\n\n- `File.write_string(path Str, content Str) bool`:  \n  Creates or overwrites `path` with `content`. Returns `true` on success.\n- `File.append_string(path Str, content Str) bool`:  \n  Appends `content` to the end of `path`. Creates the file if it does not exist.\n\n### Metadata & Manipulation\n\n- `File.exists(path Str) bool`: Returns `true` if the path exists on disk.\n- `File.size(path Str) u64`: Returns the size of the file in bytes.\n- `File.delete(path Str) bool`: Removes the file from the filesystem.\n\n---\n\n## 2. Stream-Based I/O (`FileStream`)\n\nFor large files that cannot or should not be loaded into memory all at once, use `FileStream`:\n\n```abyss\nFile :: @import(\"std/fs\").File\n\nprocess_large_file :: fn(path Str) {\n    stream_opt := File.open_read(path)\n    if stream_opt.is_none() {\n        ret\n    }\n\n    stream := stream_opt.unwrap()\n\n    -- Inspect size and position\n    total_size := stream.size()\n    print(total_size)\n\n    -- Close the OS handle when finished\n    stream.close()\n}\n```\n\n### Complete `FileStream` API\n\n- **Constructors**:\n  - `File.open_read(path Str) Maybe(FileStream)`: Opens in read-only mode (`\"rb\"`).\n  - `File.create(path Str) Maybe(FileStream)`: Creates or truncates for writing (`\"wb\"`).\n  - `File.open_append(path Str) Maybe(FileStream)`: Opens for appending (`\"ab\"`).\n- **Methods**:\n  - `self.read(buf &u8, count u64) u64`: Reads up to `count` bytes into `buf`.\n  - `self.write(buf &u8, count u64) u64`: Writes `count` bytes from `buf`.\n  - `self.write_str(s Str) bool`: Writes a string slice to the stream.\n  - `self.seek(offset i64, whence i32) bool`: Moves file position cursor.\n  - `self.seek_to_start() bool`: Rewinds to byte offset 0.\n  - `self.seek_to_end() bool`: Seeks to the end of the file.\n  - `self.tell() i64`: Returns current byte cursor offset.\n  - `self.size() u64`: Computes file size.\n  - `self.close()`: Closes the underlying operating system file descriptor.\n\n---\n\n## 3. Path Manipulation (`Path`)\n\nThe `Path` module handles file path parsing, component extraction, and path joining across Windows, Linux, and macOS:\n\n```abyss\nPath :: @import(\"std/path\").Path\nArena :: @import(\"std/allocator\").Arena\n\nmain :: fn() {\n    arena := Arena.new(4096)\n\n    -- Joining components\n    full_path := Path.join(&arena, \"src\", \"compiler\", \"main.a\")\n    print(full_path)            -- \"src/compiler/main.a\"\n\n    -- Decomposing paths\n    dir := Path.dirname(full_path)\n    base := Path.basename(full_path)\n    ext := Path.extension(full_path)\n\n    print(dir)                  -- \"src/compiler\"\n    print(base)                 -- \"main.a\"\n    print(ext)                  -- \".a\"\n\n    arena.destroy()\n}\n```\n\n### Complete `Path` API\n\n- `Path.join(arena &Arena, a Str, b Str) Str`: Joins two path components using the appropriate path separator.\n- `Path.dirname(path Str) Str`: Extracts the directory containing the file.\n- `Path.basename(path Str) Str`: Extracts the file name and extension.\n- `Path.extension(path Str) Str`: Returns the file extension including the leading dot (`.`).\n- `Path.is_absolute(path Str) bool`: Checks if the path is an absolute root path.\n\n---\n\n[← Previous: I/O & Formatting](03-io-and-fmt.md) | [Next: Allocators & Memory Reference →](05-allocators-and-mem.md)\n", "04-reference/04-fs-and-path.md": "# Filesystem & Paths Reference: `std/fs` and `std/path`\n\nThe `std/fs` and `std/path` modules provide clean, cross-platform file system operations. They operate natively on Abyss's allocation-free `Str` type and integrate seamlessly with `Arena` memory management.\n\n```abyss\nFile :: @import(\"std/fs\").File\nPath :: @import(\"std/path\").Path\nArena :: @import(\"std/allocator\").Arena\n\nmain :: fn() {\n    arena := Arena.new(65536)\n\n    -- 1. Combine paths portably\n    log_path := Path.join(&arena, \"logs\", \"app.log\")\n\n    -- 2. Write content directly\n    File.write_string(log_path, \"Application started\\n\")\n\n    -- 3. Read content into an arena\n    opt := File.read_to_string(&arena, log_path)\n    if opt.is_some() {\n        print(opt.unwrap())\n    }\n\n    arena.destroy()\n}\n```\n\n---\n\n## 1. High-Level File Operations (`File`)\n\nThe static `File` struct provides convenient single-call functions for reading, writing, and inspecting files:\n\n### Reading Files\n\n- `File.read_to_string(arena &Arena, path Str) Maybe(Str)`:  \n  Reads the entire contents of a file into memory allocated within `arena`. Returns `none()` if the file does not exist or cannot be read.\n\n```abyss\nopt := File.read_to_string(&scratch, \"config.json\")\nif opt.is_some() {\n    content := opt.unwrap()\n    print(content)\n}\n```\n\n### Writing & Appending\n\n- `File.write_string(path Str, content Str) bool`:  \n  Creates or overwrites `path` with `content`. Returns `true` on success.\n- `File.append_string(path Str, content Str) bool`:  \n  Appends `content` to the end of `path`. Creates the file if it does not exist.\n\n### Metadata & Manipulation\n\n- `File.exists(path Str) bool`: Returns `true` if the path exists on disk.\n- `File.size(path Str) u64`: Returns the size of the file in bytes.\n- `File.delete(path Str) bool`: Removes the file from the filesystem.\n\n---\n\n## 2. Stream-Based I/O (`FileStream`)\n\nFor large files that cannot or should not be loaded into memory all at once, use `FileStream`:\n\n```abyss\nFile :: @import(\"std/fs\").File\n\nprocess_large_file :: fn(path Str) {\n    stream_opt := File.open_read(path)\n    if stream_opt.is_none() {\n        ret\n    }\n\n    stream := stream_opt.unwrap()\n\n    -- Inspect size and position\n    total_size := stream.size()\n    print(total_size)\n\n    -- Close the OS handle when finished\n    stream.close()\n}\n```\n\n### Complete `FileStream` API\n\n- **Constructors**:\n  - `File.open_read(path Str) Maybe(FileStream)`: Opens in read-only mode (`\"rb\"`).\n  - `File.create(path Str) Maybe(FileStream)`: Creates or truncates for writing (`\"wb\"`).\n  - `File.open_append(path Str) Maybe(FileStream)`: Opens for appending (`\"ab\"`).\n- **Methods**:\n  - `self.read(buf &u8, count u64) u64`: Reads up to `count` bytes into `buf`.\n  - `self.write(buf &u8, count u64) u64`: Writes `count` bytes from `buf`.\n  - `self.write_str(s Str) bool`: Writes a string slice to the stream.\n  - `self.seek(offset i64, whence i32) bool`: Moves file position cursor.\n  - `self.seek_to_start() bool`: Rewinds to byte offset 0.\n  - `self.seek_to_end() bool`: Seeks to the end of the file.\n  - `self.tell() i64`: Returns current byte cursor offset.\n  - `self.size() u64`: Computes file size.\n  - `self.close()`: Closes the underlying operating system file descriptor.\n\n---\n\n## 3. Path Manipulation (`Path`)\n\nThe `Path` module handles file path parsing, component extraction, and path joining across Windows, Linux, and macOS:\n\n```abyss\nPath :: @import(\"std/path\").Path\nArena :: @import(\"std/allocator\").Arena\n\nmain :: fn() {\n    arena := Arena.new(4096)\n\n    -- Joining components\n    full_path := Path.join(&arena, \"src\", \"compiler\", \"main.a\")\n    print(full_path)            -- \"src/compiler/main.a\"\n\n    -- Decomposing paths\n    dir := Path.dirname(full_path)\n    base := Path.basename(full_path)\n    ext := Path.extension(full_path)\n\n    print(dir)                  -- \"src/compiler\"\n    print(base)                 -- \"main.a\"\n    print(ext)                  -- \".a\"\n\n    arena.destroy()\n}\n```\n\n### Complete `Path` API\n\n- `Path.join(arena &Arena, a Str, b Str) Str`: Joins two path components using the appropriate path separator.\n- `Path.dirname(path Str) Str`: Extracts the directory containing the file.\n- `Path.basename(path Str) Str`: Extracts the file name and extension.\n- `Path.extension(path Str) Str`: Returns the file extension including the leading dot (`.`).\n- `Path.is_absolute(path Str) bool`: Checks if the path is an absolute root path.\n\n---\n\n[← Previous: I/O & Formatting](03-io-and-fmt.md) | [Next: Allocators & Memory Reference →](05-allocators-and-mem.md)\n", "docs/04-reference/05-allocators-and-mem.md": "# Allocators & Memory Reference: `std/allocator` and `std/mem`\n\nAbyss provides two distinct levels of memory management:\n1. **Scoped Arena Allocator (`std/allocator: Arena`)**: High-performance, fragment-free bump allocation for phases, requests, and structured lifecycles.\n2. **Low-Level Memory Primitives (`std/mem`)**: Direct system-level heap allocation (`malloc`, `free`, `realloc`) and raw byte operations (`mem_copy`, `mem_set`).\n\n```abyss\nArena :: @import(\"std/allocator\").Arena\n\nmain :: fn() {\n    -- 1. Create a scoped arena\n    arena := Arena.new(32768)\n\n    -- 2. Allocate typed structures with 8-byte alignment\n    point := arena.alloc_type(Point)\n    point.x = 100\n    point.y = 200\n\n    -- 3. Release entire memory pool in O(1)\n    arena.destroy()\n}\n```\n\n---\n\n## 1. The Arena Allocator (`std/allocator: Arena`)\n\nThe `Arena` struct manages a linked chain of memory chunks. Allocations simply advance an offset pointer (bump allocation), making them nearly instantaneous ($O(1)$) and keeping memory contiguous for optimal CPU cache utilization.\n\n### Complete `Arena` API\n\n- `Arena.new(default_chunk_size u64) Arena`:  \n  Initializes an arena with a default chunk size (e.g. 4096, 65536).\n- `self.alloc(size u64) &u8`:  \n  Allocates `size` bytes from the current chunk with 8-byte alignment. If the chunk lacks space, a new chunk is allocated automatically.\n- `self.alloc_type(T type) &T`:  \n  Convenience helper that allocates `@sizeof(T)` bytes and returns a typed pointer `&T`.\n- `self.alloc_slice(T type, count u64) Slice(T)`:  \n  Allocates contiguous memory for `count` elements of type `T` and returns a `Slice(T)` view.\n- `self.reset()`:  \n  Resets allocation offsets back to zero without freeing the underlying chunks from the OS. This allows reusing the allocated memory across iterations or game frames with zero allocation overhead.\n- `self.destroy()`:  \n  Frees all chunks and returns memory to the operating system.\n\n### The Arena Lifecycle Pattern\n\n```abyss\nhandle_web_request :: fn() {\n    scratch := Arena.new(65536)\n\n    -- Allocate whatever the request needs:\n    -- strings, JSON nodes, temporary buffers...\n\n    -- When request finishes, free all allocations in one call:\n    scratch.destroy()\n}\n```\n\n---\n\n## 2. Low-Level Heap Memory (`std/mem`)\n\nThe `std/mem` module exposes direct, raw memory allocation routines interfacing directly with the platform's C runtime or system allocator:\n\n```abyss\nmem :: @import(\"std/mem\")\n\nmain :: fn() {\n    -- Allocate raw bytes\n    buf := mem.malloc(1024)\n\n    -- Zero-fill memory\n    mem.mem_zero(buf, 1024)\n\n    -- Free raw bytes\n    mem.free(buf)\n}\n```\n\n### Complete `std/mem` API\n\n- `malloc(size u64) &u8`: Allocates `size` uninitialized bytes from the system heap.\n- `free(ptr &u8)`: Deallocates memory previously returned by `malloc` or `realloc`.\n- `realloc(ptr &u8, new_size u64) &u8`: Resizes an existing heap allocation.\n- `mem_copy(dest &u8, src &u8, count u64)`: Copies `count` bytes from `src` to `dest`.\n- `mem_set(dest &u8, val u8, count u64)`: Sets `count` bytes of `dest` to `val`.\n- `mem_zero(dest &u8, count u64)`: Sets `count` bytes of `dest` to 0.\n- `mem_eq(a &u8, b &u8, count u64) bool`: Compares `count` bytes for equality.\n\n---\n\n## 3. Allocation Strategy Guide\n\n| Use Case | Recommended Allocator | Rationale |\n| :--- | :--- | :--- |\n| **Short-lived phase, loop, or request** | `Arena` | Fast $O(1)$ bump allocation, zero fragmentation, instant cleanup. |\n| **Frame updates (games, simulations)** | `Arena` with `.reset()` | Zero new allocations after initial warmup. |\n| **Collections (`Vec`, `HashMap`)** | `malloc` / `realloc` via collection methods | Supports independent growth and resizing. |\n| **Long-lived single objects** | `malloc` / `Arena` | Depends on lifecycle boundaries. |\n\n---\n\n[← Previous: Filesystem & Paths](04-fs-and-path.md) | [Next: System & Threading Reference →](06-sys-and-threading.md)\n", "04-reference/05-allocators-and-mem.md": "# Allocators & Memory Reference: `std/allocator` and `std/mem`\n\nAbyss provides two distinct levels of memory management:\n1. **Scoped Arena Allocator (`std/allocator: Arena`)**: High-performance, fragment-free bump allocation for phases, requests, and structured lifecycles.\n2. **Low-Level Memory Primitives (`std/mem`)**: Direct system-level heap allocation (`malloc`, `free`, `realloc`) and raw byte operations (`mem_copy`, `mem_set`).\n\n```abyss\nArena :: @import(\"std/allocator\").Arena\n\nmain :: fn() {\n    -- 1. Create a scoped arena\n    arena := Arena.new(32768)\n\n    -- 2. Allocate typed structures with 8-byte alignment\n    point := arena.alloc_type(Point)\n    point.x = 100\n    point.y = 200\n\n    -- 3. Release entire memory pool in O(1)\n    arena.destroy()\n}\n```\n\n---\n\n## 1. The Arena Allocator (`std/allocator: Arena`)\n\nThe `Arena` struct manages a linked chain of memory chunks. Allocations simply advance an offset pointer (bump allocation), making them nearly instantaneous ($O(1)$) and keeping memory contiguous for optimal CPU cache utilization.\n\n### Complete `Arena` API\n\n- `Arena.new(default_chunk_size u64) Arena`:  \n  Initializes an arena with a default chunk size (e.g. 4096, 65536).\n- `self.alloc(size u64) &u8`:  \n  Allocates `size` bytes from the current chunk with 8-byte alignment. If the chunk lacks space, a new chunk is allocated automatically.\n- `self.alloc_type(T type) &T`:  \n  Convenience helper that allocates `@sizeof(T)` bytes and returns a typed pointer `&T`.\n- `self.alloc_slice(T type, count u64) Slice(T)`:  \n  Allocates contiguous memory for `count` elements of type `T` and returns a `Slice(T)` view.\n- `self.reset()`:  \n  Resets allocation offsets back to zero without freeing the underlying chunks from the OS. This allows reusing the allocated memory across iterations or game frames with zero allocation overhead.\n- `self.destroy()`:  \n  Frees all chunks and returns memory to the operating system.\n\n### The Arena Lifecycle Pattern\n\n```abyss\nhandle_web_request :: fn() {\n    scratch := Arena.new(65536)\n\n    -- Allocate whatever the request needs:\n    -- strings, JSON nodes, temporary buffers...\n\n    -- When request finishes, free all allocations in one call:\n    scratch.destroy()\n}\n```\n\n---\n\n## 2. Low-Level Heap Memory (`std/mem`)\n\nThe `std/mem` module exposes direct, raw memory allocation routines interfacing directly with the platform's C runtime or system allocator:\n\n```abyss\nmem :: @import(\"std/mem\")\n\nmain :: fn() {\n    -- Allocate raw bytes\n    buf := mem.malloc(1024)\n\n    -- Zero-fill memory\n    mem.mem_zero(buf, 1024)\n\n    -- Free raw bytes\n    mem.free(buf)\n}\n```\n\n### Complete `std/mem` API\n\n- `malloc(size u64) &u8`: Allocates `size` uninitialized bytes from the system heap.\n- `free(ptr &u8)`: Deallocates memory previously returned by `malloc` or `realloc`.\n- `realloc(ptr &u8, new_size u64) &u8`: Resizes an existing heap allocation.\n- `mem_copy(dest &u8, src &u8, count u64)`: Copies `count` bytes from `src` to `dest`.\n- `mem_set(dest &u8, val u8, count u64)`: Sets `count` bytes of `dest` to `val`.\n- `mem_zero(dest &u8, count u64)`: Sets `count` bytes of `dest` to 0.\n- `mem_eq(a &u8, b &u8, count u64) bool`: Compares `count` bytes for equality.\n\n---\n\n## 3. Allocation Strategy Guide\n\n| Use Case | Recommended Allocator | Rationale |\n| :--- | :--- | :--- |\n| **Short-lived phase, loop, or request** | `Arena` | Fast $O(1)$ bump allocation, zero fragmentation, instant cleanup. |\n| **Frame updates (games, simulations)** | `Arena` with `.reset()` | Zero new allocations after initial warmup. |\n| **Collections (`Vec`, `HashMap`)** | `malloc` / `realloc` via collection methods | Supports independent growth and resizing. |\n| **Long-lived single objects** | `malloc` / `Arena` | Depends on lifecycle boundaries. |\n\n---\n\n[← Previous: Filesystem & Paths](04-fs-and-path.md) | [Next: System & Threading Reference →](06-sys-and-threading.md)\n", "docs/04-reference/06-sys-and-threading.md": "# System & Threading Reference: `std/sys` and `std/thread`\n\nThe `std/sys` and `std/thread` modules give Abyss direct access to host operating system facilities, process control, and native 1:1 kernel threads.\n\nAbyss has no runtime scheduler, green thread machinery, or hidden thread pools. When you spawn a thread, it maps directly to a lightweight native OS thread (POSIX `pthread` on Linux/macOS, Win32 threads on Windows).\n\n```abyss\nthread :: @import(\"std/thread\")\n\nJob :: struct {\n    start u64\n    count u64\n}\n\nsum_range :: fn(job Job) u64 {\n    total: u64 = 0\n    i := job.start\n    while i < job.start + job.count {\n        total = total + i\n        i = i + 1\n    }\n    total\n}\n\nmain :: fn() {\n    job: Job = .{ start: 1, count: 1000 }\n\n    -- Spawn worker with value capture\n    handle := thread.spawn_with(sum_range, job).unwrap()\n\n    -- Wait and collect typed result\n    result := handle.join().unwrap()\n    print(result)\n}\n```\n\n---\n\n## 1. System Primitives (`std/sys`)\n\nThe `std/sys` module provides low-level process controls and standard I/O streams:\n\n### Process Control\n- `sys.exit_process(code i32)`: Immediately terminates the current process with an exit status code.\n- `sys.fall`: Macro that prints the current `@source_location()` to `stderr` and terminates the process with status 1.\n\n### Standard Stream Descriptors\n- `sys.STDIN`: Standard input descriptor (`0`).\n- `sys.STDOUT`: Standard output descriptor (`1`).\n- `sys.STDERR`: Standard error descriptor (`2`).\n- `sys.write_console(text Str)`: Writes directly to standard output.\n- `sys.write_stderr(text Str)`: Writes directly to standard error.\n\n---\n\n## 2. Spawning Native Threads (`std/thread`)\n\nWorker callbacks in Abyss are ordinary typed functions. Spawning functions check captures and return types recursively at compile time to guarantee thread safety.\n\n### Spawning Variants\n\n1. **`thread.spawn(work fn() R) Result(Thread(R))`**:  \n   Runs a function with zero arguments.\n2. **`thread.spawn_with(work fn(T) R, capture T) Result(Thread(R))`**:  \n   Copies `capture` by value into the thread job. The capture must be **pointer-free** (scalars, arrays, and value structs; pointers, slices, and `Str` are rejected at compile time).\n3. **`thread.spawn_shared(work fn(&T) R, state &T) Result(Thread(R))`**:  \n   Explicitly permits passing borrowed state across threads. The programmer is responsible for ensuring `state` outlives the worker.\n4. **`thread.spawn_detached(work fn(T), capture T) Result(Unit)`**:  \n   Spawns a background task that runs independently. The worker frees its own job upon completion without needing a `join()`.\n\n---\n\n## 3. Joining and Thread Lifecycle\n\nA `Thread(R)` handle represents a single-owner capability to wait on a worker:\n\n```abyss\nhandle := thread.spawn_with(compute, data).unwrap()\n\n-- Block until worker completes and retrieve typed return value:\nres := handle.join()\nif res.is_success() {\n    print(res.unwrap())\n}\n```\n\n### Thread Control\n\n- `thread.sleep(milliseconds u32) Result(Unit)`:  \n  Suspends execution of the calling thread for the specified duration without busy-waiting.\n- `thread.yield()`:  \n  Relinquishes the current thread's remaining timeslice to the OS scheduler.\n\n---\n\n## 4. Mutex Synchronization (`Mutex(T)`)\n\n`Mutex(T)` encapsulates a typed value protected by a native operating system mutual exclusion lock:\n\n```abyss\nthread :: @import(\"std/thread\")\nMutex :: @import(\"std/thread\").Mutex\n\nCounter :: struct {\n    value i32\n}\n\nmain :: fn() {\n    -- Create a mutex protecting a Counter\n    lock := Mutex(Counter).new(.{ value: 0 })\n\n    -- Acquire reference to protected data\n    ptr := lock.lock()\n    ptr.value = ptr.value + 1\n    lock.unlock()\n\n    -- Or safely execute a block with automatic unlock:\n    lock.with_lock(fn(c &Counter) {\n        c.value = c.value + 10\n    })\n\n    -- Release native lock when completely done\n    lock.destroy()\n}\n```\n\n### Complete `Mutex(T)` API\n\n- `Mutex(T).new(initial_val T) Mutex(T)`: Allocates a new native mutex lock protecting `initial_val`.\n- `self.lock() &T`: Blocks until the lock is acquired and returns a mutable pointer to the inner data.\n- `self.unlock()`: Releases the lock.\n- `self.try_lock() Maybe(&T)`: Non-blocking attempt; returns `some(&T)` if acquired immediately, or `none()` if contested.\n- `self.with_lock(work fn(&T) R) R`: Acquires lock, passes `&T` to `work`, and unlocks automatically upon return.\n- `self.destroy()`: Destroys the underlying OS mutex lock.\n\n---\n\n## 5. Platform Support & Linking\n\n- `thread.supported` is a compile-time boolean constant. Threads are fully supported on **Linux**, **macOS**, and **Windows**.\n- WASI and freestanding targets do not support native threads.\n- When compiling native C output manually on POSIX targets, ensure `-pthread` is passed to the C compiler/linker:\n  ```sh\n  abyssc b main.a out.c\n  gcc -pthread -O3 out.c -o main\n  ```\n  *(When compiling via `sonar build`, `-pthread` is linked automatically on supported platforms.)*\n\n---\n\n[← Previous: Allocators & Memory](05-allocators-and-mem.md) | [Back to Table of Contents →](../README.md)\n", "04-reference/06-sys-and-threading.md": "# System & Threading Reference: `std/sys` and `std/thread`\n\nThe `std/sys` and `std/thread` modules give Abyss direct access to host operating system facilities, process control, and native 1:1 kernel threads.\n\nAbyss has no runtime scheduler, green thread machinery, or hidden thread pools. When you spawn a thread, it maps directly to a lightweight native OS thread (POSIX `pthread` on Linux/macOS, Win32 threads on Windows).\n\n```abyss\nthread :: @import(\"std/thread\")\n\nJob :: struct {\n    start u64\n    count u64\n}\n\nsum_range :: fn(job Job) u64 {\n    total: u64 = 0\n    i := job.start\n    while i < job.start + job.count {\n        total = total + i\n        i = i + 1\n    }\n    total\n}\n\nmain :: fn() {\n    job: Job = .{ start: 1, count: 1000 }\n\n    -- Spawn worker with value capture\n    handle := thread.spawn_with(sum_range, job).unwrap()\n\n    -- Wait and collect typed result\n    result := handle.join().unwrap()\n    print(result)\n}\n```\n\n---\n\n## 1. System Primitives (`std/sys`)\n\nThe `std/sys` module provides low-level process controls and standard I/O streams:\n\n### Process Control\n- `sys.exit_process(code i32)`: Immediately terminates the current process with an exit status code.\n- `sys.fall`: Macro that prints the current `@source_location()` to `stderr` and terminates the process with status 1.\n\n### Standard Stream Descriptors\n- `sys.STDIN`: Standard input descriptor (`0`).\n- `sys.STDOUT`: Standard output descriptor (`1`).\n- `sys.STDERR`: Standard error descriptor (`2`).\n- `sys.write_console(text Str)`: Writes directly to standard output.\n- `sys.write_stderr(text Str)`: Writes directly to standard error.\n\n---\n\n## 2. Spawning Native Threads (`std/thread`)\n\nWorker callbacks in Abyss are ordinary typed functions. Spawning functions check captures and return types recursively at compile time to guarantee thread safety.\n\n### Spawning Variants\n\n1. **`thread.spawn(work fn() R) Result(Thread(R))`**:  \n   Runs a function with zero arguments.\n2. **`thread.spawn_with(work fn(T) R, capture T) Result(Thread(R))`**:  \n   Copies `capture` by value into the thread job. The capture must be **pointer-free** (scalars, arrays, and value structs; pointers, slices, and `Str` are rejected at compile time).\n3. **`thread.spawn_shared(work fn(&T) R, state &T) Result(Thread(R))`**:  \n   Explicitly permits passing borrowed state across threads. The programmer is responsible for ensuring `state` outlives the worker.\n4. **`thread.spawn_detached(work fn(T), capture T) Result(Unit)`**:  \n   Spawns a background task that runs independently. The worker frees its own job upon completion without needing a `join()`.\n\n---\n\n## 3. Joining and Thread Lifecycle\n\nA `Thread(R)` handle represents a single-owner capability to wait on a worker:\n\n```abyss\nhandle := thread.spawn_with(compute, data).unwrap()\n\n-- Block until worker completes and retrieve typed return value:\nres := handle.join()\nif res.is_success() {\n    print(res.unwrap())\n}\n```\n\n### Thread Control\n\n- `thread.sleep(milliseconds u32) Result(Unit)`:  \n  Suspends execution of the calling thread for the specified duration without busy-waiting.\n- `thread.yield()`:  \n  Relinquishes the current thread's remaining timeslice to the OS scheduler.\n\n---\n\n## 4. Mutex Synchronization (`Mutex(T)`)\n\n`Mutex(T)` encapsulates a typed value protected by a native operating system mutual exclusion lock:\n\n```abyss\nthread :: @import(\"std/thread\")\nMutex :: @import(\"std/thread\").Mutex\n\nCounter :: struct {\n    value i32\n}\n\nmain :: fn() {\n    -- Create a mutex protecting a Counter\n    lock := Mutex(Counter).new(.{ value: 0 })\n\n    -- Acquire reference to protected data\n    ptr := lock.lock()\n    ptr.value = ptr.value + 1\n    lock.unlock()\n\n    -- Or safely execute a block with automatic unlock:\n    lock.with_lock(fn(c &Counter) {\n        c.value = c.value + 10\n    })\n\n    -- Release native lock when completely done\n    lock.destroy()\n}\n```\n\n### Complete `Mutex(T)` API\n\n- `Mutex(T).new(initial_val T) Mutex(T)`: Allocates a new native mutex lock protecting `initial_val`.\n- `self.lock() &T`: Blocks until the lock is acquired and returns a mutable pointer to the inner data.\n- `self.unlock()`: Releases the lock.\n- `self.try_lock() Maybe(&T)`: Non-blocking attempt; returns `some(&T)` if acquired immediately, or `none()` if contested.\n- `self.with_lock(work fn(&T) R) R`: Acquires lock, passes `&T` to `work`, and unlocks automatically upon return.\n- `self.destroy()`: Destroys the underlying OS mutex lock.\n\n---\n\n## 5. Platform Support & Linking\n\n- `thread.supported` is a compile-time boolean constant. Threads are fully supported on **Linux**, **macOS**, and **Windows**.\n- WASI and freestanding targets do not support native threads.\n- When compiling native C output manually on POSIX targets, ensure `-pthread` is passed to the C compiler/linker:\n  ```sh\n  abyssc b main.a out.c\n  gcc -pthread -O3 out.c -o main\n  ```\n  *(When compiling via `sonar build`, `-pthread` is linked automatically on supported platforms.)*\n\n---\n\n[← Previous: Allocators & Memory](05-allocators-and-mem.md) | [Back to Table of Contents →](../README.md)\n"};

async function handleRunCode(wrap, rawCode, runBtn) {
  const prevHtml = runBtn.innerHTML;
  runBtn.disabled = true;
  runBtn.innerHTML = "Running...";

  let outContainer = wrap.querySelector(".code-output-container");
  if (!outContainer) {
    outContainer = document.createElement("div");
    outContainer.className = "code-output-container";
    outContainer.innerHTML = '<div class="code-output-header"><div class="code-output-meta"><span>Console Output</span><span class="code-output-status"></span><span class="code-output-time"></span></div><button class="code-output-close" title="Close Output">&times;</button></div><pre class="code-output-content"></pre>';
    wrap.appendChild(outContainer);
    outContainer.querySelector(".code-output-close").addEventListener("click", () => {
      outContainer.classList.remove("visible");
    });
  }

  outContainer.classList.add("visible");
  const statusEl = outContainer.querySelector(".code-output-status");
  const timeEl = outContainer.querySelector(".code-output-time");
  const contentEl = outContainer.querySelector(".code-output-content");

  statusEl.className = "code-output-status";
  statusEl.textContent = "Running";
  timeEl.textContent = "";
  contentEl.innerHTML = '<span style="color:#71717a;">Executing in WebAssembly VM...</span>';

  try {
    let codeToRun = rawCode.trim();
    if (!codeToRun.includes("main :: fn(") && !codeToRun.includes("main::fn(")) {
      codeToRun = "main :: fn() {\n" + codeToRun + "\n}\n";
    }

    const res = await AbyssEnv.run(codeToRun);
    timeEl.textContent = res.elapsed + "ms";

    if (res.exitCode === 0) {
      statusEl.className = "code-output-status success";
      statusEl.textContent = "Success";
    } else {
      statusEl.className = "code-output-status error";
      statusEl.textContent = "Exit " + res.exitCode;
    }

    let rendered = "";
    if (res.rawOutput && res.rawOutput.trim().length > 0) {
      rendered = AbyssEnv.parseAnsi(res.rawOutput);
    } else if (res.exitCode === 0) {
      rendered = '<span style="color:#71717a;">(Program executed successfully with no output)</span>';
    } else {
      rendered = '<span class="ansi-red">Program exited with code ' + res.exitCode + '</span>';
    }
    contentEl.innerHTML = rendered;
  } catch (err) {
    statusEl.className = "code-output-status error";
    statusEl.textContent = "Error";
    contentEl.innerHTML = '<span class="ansi-red">Runtime error: ' + AbyssEnv.escapeHtml(err.message || String(err)) + '</span>';
  } finally {
    runBtn.disabled = false;
    runBtn.innerHTML = prevHtml;
  }
}

function renderFallbackMarkdown(md) {
  const lines = md.split("\n");
  let html = "";
  let inCode = false;
  let codeLang = "";
  let codeBuffer = [];
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim().startsWith("```")) {
      if (!inCode) {
        if (inList) { html += "</ul>"; inList = false; }
        inCode = true;
        codeLang = line.trim().slice(3).trim();
        codeBuffer = [];
      } else {
        inCode = false;
        const rawCode = codeBuffer.join("\n");
        let highlighted = "";
        if (codeLang === "abyss" || codeLang === "a") highlighted = highlightAbyss(rawCode);
        else if (codeLang === "sh" || codeLang === "bash" || codeLang === "shell") highlighted = highlightShell(rawCode);
        else highlighted = escapeHtml(rawCode);

        const isAbyss = (codeLang === "abyss" || codeLang === "a");
        const runBtnHtml = isAbyss ? '<button class="code-run-btn" title="Run in browser"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> Run</button>' : "";

        html += '<div class="code-container"><div class="code-header"><span class="code-lang">' + (codeLang || "text") + '</span><div class="code-actions">' + runBtnHtml + '<button class="code-copy-btn">Copy</button></div></div><pre><code class="code-content">' + highlighted + '</code></pre></div>';
      }
      continue;
    }

    if (inCode) {
      codeBuffer.push(line);
      continue;
    }

    if (line.startsWith("# ")) {
      if (inList) { html += "</ul>"; inList = false; }
      html += "<h1>" + formatInline(line.slice(2)) + "</h1>";
    } else if (line.startsWith("## ")) {
      if (inList) { html += "</ul>"; inList = false; }
      html += "<h2>" + formatInline(line.slice(3)) + "</h2>";
    } else if (line.startsWith("### ")) {
      if (inList) { html += "</ul>"; inList = false; }
      html += "<h3>" + formatInline(line.slice(4)) + "</h3>";
    } else if (line.startsWith("---")) {
      if (inList) { html += "</ul>"; inList = false; }
      html += "<hr />";
    } else if (line.startsWith("> ")) {
      if (inList) { html += "</ul>"; inList = false; }
      html += "<blockquote>" + formatInline(line.slice(2)) + "</blockquote>";
    } else if (line.startsWith("- ") || line.startsWith("* ")) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + formatInline(line.slice(2)) + "</li>";
    } else if (line.trim() === "") {
      if (inList) { html += "</ul>"; inList = false; }
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      html += "<p>" + formatInline(line) + "</p>";
    }
  }
  if (inList) html += "</ul>";
  return html;
}

function formatInline(str) {
  return escapeHtml(str)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^\)]+)\)/g, "<a href='$2'>$1</a>");
}

function postProcessHtml(container) {
  container.querySelectorAll("pre").forEach(pre => {
    if (pre.closest(".code-container")) return;
    const code = pre.querySelector("code");
    const raw = code ? code.innerText : pre.innerText;
    let lang = "text";
    if (code) {
      const cls = code.className || "";
      const match = cls.match(/language-([a-zA-Z0-9_\-]+)/);
      if (match) lang = match[1];
    }
    let highlighted = "";
    if (lang === "abyss" || lang === "a") highlighted = highlightAbyss(raw);
    else if (lang === "sh" || lang === "bash" || lang === "shell") highlighted = highlightShell(raw);
    else highlighted = escapeHtml(raw);

    const isAbyss = (lang === "abyss" || lang === "a");
    const runBtnHtml = isAbyss ? '<button class="code-run-btn" title="Run in browser"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> Run</button>' : "";

    const wrap = document.createElement("div");
    wrap.className = "code-container";
    wrap.innerHTML = '<div class="code-header"><span class="code-lang">' + lang + '</span><div class="code-actions">' + runBtnHtml + '<button class="code-copy-btn">Copy</button></div></div><pre><code class="code-content">' + highlighted + '</code></pre>';
    pre.replaceWith(wrap);

    if (isAbyss) {
      const runBtn = wrap.querySelector(".code-run-btn");
      runBtn.addEventListener("click", () => handleRunCode(wrap, raw, runBtn));
    }
  });

  container.querySelectorAll(".code-container").forEach(wrap => {
    const langSpan = wrap.querySelector(".code-lang");
    const lang = langSpan ? langSpan.textContent.trim().toLowerCase() : "";
    if (lang === "abyss" || lang === "a") {
      let runBtn = wrap.querySelector(".code-run-btn");
      if (!runBtn) {
        const actions = wrap.querySelector(".code-actions");
        if (actions) {
          runBtn = document.createElement("button");
          runBtn.className = "code-run-btn";
          runBtn.title = "Run in browser";
          runBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> Run';
          actions.insertBefore(runBtn, actions.firstChild);
        }
      }
      if (runBtn && !runBtn.dataset.bound) {
        runBtn.dataset.bound = "true";
        const codeEl = wrap.querySelector("code");
        const raw = codeEl ? codeEl.innerText : "";
        runBtn.addEventListener("click", () => handleRunCode(wrap, raw, runBtn));
      }
    }
  });

  container.querySelectorAll("table").forEach(table => {
    if (table.parentElement && table.parentElement.classList.contains("table-wrap")) return;
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });

  container.querySelectorAll("img").forEach(img => {
    const src = img.getAttribute("src") || "";
    if (src.startsWith("assets/")) {
      img.src = GITHUB_RAW_BASE + src;
    }
  });

  container.querySelectorAll(".code-copy-btn").forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = "true";
    btn.addEventListener("click", () => {
      const code = btn.closest(".code-container").querySelector("code");
      if (!code) return;
      navigator.clipboard.writeText(code.innerText.trim()).then(() => {
        const prev = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = prev; }, 1600);
      });
    });
  });

  container.querySelectorAll("a").forEach(a => {
    const href = a.getAttribute("href") || "";
    if (href.startsWith("http://") || href.startsWith("https://")) {
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    } else if (href.endsWith(".md") || href.includes(".md#")) {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        const target = resolveDocPath(currentDocId, href);
        navigateTo(target);
      });
    }
  });
}

function resolveDocPath(fromDoc, linkHref) {
  const [filePart, hashPart] = linkHref.split("#");
  let currentDir = fromDoc.includes("/") ? fromDoc.slice(0, fromDoc.lastIndexOf("/")) : "";
  let parts = (currentDir ? currentDir.split("/") : []).concat(filePart.split("/"));
  let resolved = [];
  for (const p of parts) {
    if (!p || p === ".") continue;
    if (p === "..") {
      if (resolved.length > 0) resolved.pop();
    } else {
      resolved.push(p);
    }
  }
  let finalPath = resolved.join("/");
  if (finalPath.startsWith("abyss/docs/")) finalPath = finalPath.slice(6);
  return finalPath;
}

function slugify(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function buildToc() {
  const container = document.getElementById("markdown-container");
  const tocList = document.getElementById("toc-list");
  tocList.innerHTML = "";
  const headings = container.querySelectorAll("h2, h3");
  if (headings.length === 0) {
    document.getElementById("toc-panel").style.display = "none";
    return;
  }
  document.getElementById("toc-panel").style.display = "";

  headings.forEach(h => {
    const text = h.textContent.trim();
    const id = slugify(text);
    h.id = id;
    const li = document.createElement("li");
    li.className = "toc-item" + (h.tagName === "H3" ? " sub" : "");
    li.innerHTML = "<a href='#" + id + "'>" + escapeHtml(text) + "</a>";
    li.querySelector("a").addEventListener("click", (e) => {
      e.preventDefault();
      h.scrollIntoView({ behavior: "smooth" });
    });
    tocList.appendChild(li);
  });
}

function renderSidebar() {
  const navContainer = document.getElementById("nav-container");
  navContainer.innerHTML = "";

  docsNav.forEach(grp => {
    const groupEl = document.createElement("div");
    groupEl.className = "nav-group";
    groupEl.innerHTML = '<div class="nav-group-header"><span>' + escapeHtml(grp.group) + '</span>' + (grp.badge ? '<span class="nav-group-badge">' + escapeHtml(grp.badge) + '</span>' : "") + '</div>';

    const ul = document.createElement("ul");
    ul.className = "nav-items";
    grp.items.forEach(it => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "nav-link" + (it.disabled ? " disabled" : "") + (it.id === currentDocId ? " active" : "");
      a.href = it.disabled ? "#" : "#/" + it.id;
      a.innerHTML = "<span>" + escapeHtml(it.title) + "</span>";
      if (!it.disabled) {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          navigateTo(it.id);
          closeMobileSidebar();
        });
      }
      li.appendChild(a);
      ul.appendChild(li);
    });
    groupEl.appendChild(ul);
    navContainer.appendChild(groupEl);
  });
}

function updateChapterNav(docId) {
  const navEl = document.getElementById("chapter-nav");
  navEl.innerHTML = "";
  const idx = linearNav.findIndex(x => x.id === docId);
  if (idx === -1) return;

  if (idx > 0) {
    const prev = linearNav[idx - 1];
    const prevCard = document.createElement("a");
    prevCard.className = "chapter-card prev";
    prevCard.href = "#/" + prev.id;
    prevCard.innerHTML = '<span class="chapter-card-label">&larr; Previous</span><span class="chapter-card-title">' + escapeHtml(prev.title) + '</span>';
    prevCard.addEventListener("click", (e) => {
      e.preventDefault();
      navigateTo(prev.id);
    });
    navEl.appendChild(prevCard);
  }

  if (idx < linearNav.length - 1) {
    const next = linearNav[idx + 1];
    const nextCard = document.createElement("a");
    nextCard.className = "chapter-card next";
    nextCard.href = "#/" + next.id;
    nextCard.innerHTML = '<span class="chapter-card-label">Next &rarr;</span><span class="chapter-card-title">' + escapeHtml(next.title) + '</span>';
    nextCard.addEventListener("click", (e) => {
      e.preventDefault();
      navigateTo(next.id);
    });
    navEl.appendChild(nextCard);
  }
}

async function loadMarkdown(docId) {
  if (docCache.has(docId)) {
    return docCache.get(docId);
  }

  const cleanId = docId.startsWith("docs/") ? docId.slice(5) : docId;

  if (EMBEDDED_DOCS[docId]) {
    return EMBEDDED_DOCS[docId];
  }
  if (EMBEDDED_DOCS[cleanId]) {
    return EMBEDDED_DOCS[cleanId];
  }

  try {
    const res = await fetch(cleanId);
    if (res.ok) {
      const text = await res.text();
      docCache.set(docId, text);
      return text;
    }
  } catch (err) {}

  try {
    const res = await fetch(GITHUB_RAW_BASE + docId);
    if (res.ok) {
      const text = await res.text();
      docCache.set(docId, text);
      return text;
    }
  } catch (err) {}

  return "# Document Not Found\n\nThe requested file `" + docId + "` could not be retrieved.";
}

async function navigateTo(docId) {
  if (!docId) docId = "docs/README.md";
  currentDocId = docId;
  window.location.hash = "#/" + docId;

  const item = linearNav.find(x => x.id === docId);
  document.getElementById("breadcrumb-title").textContent = item ? item.title : docId;
  renderSidebar();

  const loading = document.getElementById("content-loading");
  const container = document.getElementById("markdown-container");
  loading.style.display = "flex";
  container.style.display = "none";

  const rawMd = await loadMarkdown(docId);
  loading.style.display = "none";
  container.style.display = "block";

  if (window.marked && typeof window.marked.parse === "function") {
    container.innerHTML = window.marked.parse(rawMd);
  } else {
    container.innerHTML = renderFallbackMarkdown(rawMd);
  }

  postProcessHtml(container);
  buildToc();
  updateChapterNav(docId);
  window.scrollTo({ top: 0, behavior: "instant" });
}

function closeMobileSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-overlay").classList.remove("open");
}

document.getElementById("menu-toggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebar-overlay").classList.toggle("open");
});

document.getElementById("sidebar-overlay").addEventListener("click", closeMobileSidebar);

document.getElementById("search-input").addEventListener("input", (e) => {
  const query = e.target.value.toLowerCase().trim();
  document.querySelectorAll(".nav-group").forEach(grp => {
    let groupHasMatch = false;
    grp.querySelectorAll(".nav-link").forEach(link => {
      const text = link.textContent.toLowerCase();
      if (!query || text.includes(query)) {
        link.style.display = "flex";
        groupHasMatch = true;
      } else {
        link.style.display = "none";
      }
    });
    grp.style.display = groupHasMatch ? "block" : "none";
  });
});

window.addEventListener("hashchange", () => {
  const hashDoc = window.location.hash.replace(/^#\/?/, "");
  if (hashDoc && hashDoc !== currentDocId) {
    navigateTo(hashDoc);
  }
});

const initialDoc = window.location.hash.replace(/^#\/?/, "") || "docs/README.md";
navigateTo(initialDoc);
</script>
