<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Into the Abyss &bull; Official Documentation</title>
<meta name="description" content="Official documentation and guide for the Abyss programming language." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1254 1254'%3E%3Cpolygon points='564.2,313.5 692.1,313.5 975.0,939.5 854.0,939.5 627.9,436.3 392.2,939.5 270.6,939.5' fill='%23FDFCFD'/%3E%3Ccircle cx='626.3' cy='705.1' r='67.5' fill='%23FDFCFD'/%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="../syntax.js"></script>
<script src="../env.js"></script>
<style>
:root {
  --bg-main: #000000;
  --bg-surface: #000000;
  --bg-sidebar: #000000;
  --bg-card: #000000;
  --bg-code: #000000;
  --border: #141414;
  --border-focus: #262626;
  --text-main: #f4f4f5;
  --text-muted: #a1a1aa;
  --text-dim: #71717a;
  --accent: #ffffff;
  --accent-cyan: #38bdf8;
  --accent-indigo: #818cf8;
  --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "JetBrains Mono", monospace;
  --sidebar-w: 280px;
  --toc-w: 240px;
  --topbar-h: 60px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: #000000;
}

::-webkit-scrollbar-thumb {
  background: #181818;
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: #262626;
}

html {
  scroll-behavior: smooth;
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

body {
  background-color: var(--bg-main);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-h);
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.brand-link {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  color: #ffffff;
}

.brand-logo {
  height: 20px;
  width: auto;
  display: block;
}

.abyss-glyph,
.abyss-text {
  fill: #FDFCFD;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-dim);
}

.breadcrumb-sep {
  color: #27272a;
}

.breadcrumb-active {
  color: var(--text-muted);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.topbar-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.35rem 0.6rem;
  font-family: var(--font-sans);
  font-size: 0.84rem;
  font-weight: 500;
  color: #888888;
  text-decoration: none;
  background: transparent;
  border: none;
  border-radius: 4px;
  transition: color 0.15s ease;
  touch-action: manipulation;
}

.topbar-btn:hover {
  color: #ffffff;
  background: transparent;
  border: none;
}

.menu-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--border);
  color: #ffffff;
  padding: 0.5rem;
  border-radius: 6px;
  cursor: pointer;
}

.layout {
  display: flex;
  margin-top: var(--topbar-h);
  min-height: calc(100vh - var(--topbar-h));
  position: relative;
}

.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: #000000;
  border-right: 1px solid var(--border);
  position: fixed;
  top: var(--topbar-h);
  bottom: 0;
  left: 0;
  overflow-y: auto;
  padding: 1.25rem 1rem 3rem 1rem;
  z-index: 50;
  transition: transform 0.25s ease;
}

.search-box {
  margin-bottom: 1.5rem;
  position: relative;
}

.search-input {
  width: 100%;
  background: #050505;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.55rem 0.75rem 0.55rem 2.2rem;
  font-family: var(--font-sans);
  font-size: 0.82rem;
  color: #ffffff;
  outline: none;
  transition: border-color 0.15s ease;
}

.search-input:focus {
  border-color: #333333;
}

.search-input::placeholder {
  color: #52525b;
}

.search-icon {
  position: absolute;
  left: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  color: #52525b;
  pointer-events: none;
}

.nav-group {
  margin-bottom: 1.5rem;
}

.nav-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #52525b;
  margin-bottom: 0.5rem;
  padding: 0 0.5rem;
}

.nav-group-badge {
  font-size: 0.6rem;
  color: #fdba74;
  background: rgba(253, 186, 116, 0.08);
  padding: 0.1rem 0.35rem;
  border-radius: 3px;
  font-weight: 600;
}

.nav-items {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0.65rem;
  border-radius: 6px;
  font-size: 0.85rem;
  color: #a1a1aa;
  text-decoration: none;
  transition: all 0.15s ease;
  touch-action: manipulation;
}

.nav-link:hover:not(.disabled) {
  color: #ffffff;
  background: #0a0a0a;
}

.nav-link.active {
  color: #ffffff;
  background: #111111;
  border-left: none;
  font-weight: 600;
}

.nav-link.disabled {
  color: #3f3f46;
  cursor: not-allowed;
  opacity: 0.45;
}

.main-content {
  flex: 1;
  margin-left: var(--sidebar-w);
  margin-right: var(--toc-w);
  padding: 2.5rem 3rem 6rem 3rem;
  max-width: 960px;
}

.content-article {
  position: relative;
}

.doc-loader {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  padding: 6rem 0;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 0.85rem;
}

.doc-spinner {
  width: 24px;
  height: 24px;
  border: 2px solid #222222;
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.markdown-body {
  font-size: 0.95rem;
  line-height: 1.7;
  color: #d4d4d8;
}

.markdown-body h1 {
  font-size: 2.1rem;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 1.5rem;
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.markdown-body h2 {
  font-size: 1.35rem;
  font-weight: 700;
  color: #ffffff;
  margin-top: 2.5rem;
  margin-bottom: 1rem;
  letter-spacing: -0.01em;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--border);
}

.markdown-body h3 {
  font-size: 1.1rem;
  font-weight: 600;
  color: #ffffff;
  margin-top: 2rem;
  margin-bottom: 0.75rem;
}

.markdown-body p {
  margin-bottom: 1.25rem;
}

.markdown-body strong {
  color: #ffffff;
  font-weight: 600;
}

.markdown-body a {
  color: var(--accent-cyan);
  text-decoration: none;
  border-bottom: 1px solid rgba(56, 189, 248, 0.25);
  transition: all 0.15s ease;
}

.markdown-body a:hover {
  border-bottom-color: var(--accent-cyan);
}

.markdown-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2.5rem 0;
}

.markdown-body blockquote {
  margin: 1.5rem 0;
  padding: 0.85rem 1.25rem;
  background: #050505;
  border-left: 2px solid #333333;
  color: #a1a1aa;
  font-style: italic;
}

.markdown-body ul,
.markdown-body ol {
  margin-bottom: 1.25rem;
  padding-left: 1.5rem;
}

.markdown-body li {
  margin-bottom: 0.45rem;
}

.markdown-body code:not(pre code) {
  font-family: var(--font-mono);
  font-size: 0.84em;
  color: #f43f5e;
  background: #080808;
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  border: 1px solid #1a1a1a;
}

.code-container {
  margin: 1.5rem 0;
  background: #000000;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 1rem;
  background: #050505;
  border-bottom: 1px solid var(--border);
}

.code-lang {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 600;
  letter-spacing: 0.08em;
}

.code-actions {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.code-run-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.2rem 0.55rem;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 600;
  color: #38bdf8;
  background: rgba(56, 189, 248, 0.08);
  border: 1px solid rgba(56, 189, 248, 0.25);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.code-run-btn:hover:not(:disabled) {
  background: rgba(56, 189, 248, 0.18);
  border-color: #38bdf8;
  color: #ffffff;
}

.code-run-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.code-run-btn svg {
  width: 9px;
  height: 9px;
  fill: currentColor;
}

.code-copy-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 0.2rem 0.55rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.code-copy-btn:hover {
  color: #ffffff;
  border-color: #333333;
}

pre {
  margin: 0;
  padding: 1.15rem 1.25rem;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  line-height: 1.6;
  background: #000000;
}

.code-output-container {
  background: #040404;
  border-top: 1px solid #1a1a1a;
  padding: 0.75rem 1rem;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: #e4e4e7;
  display: none;
  position: relative;
}

.code-output-container.visible {
  display: block;
}

.code-output-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.5rem;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid #141414;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
}

.code-output-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.code-output-status {
  font-weight: 600;
  padding: 0.1rem 0.35rem;
  border-radius: 3px;
  font-size: 0.65rem;
}

.code-output-status.success {
  color: #4ade80;
  background: rgba(74, 222, 128, 0.1);
}

.code-output-status.error {
  color: #f87171;
  background: rgba(248, 113, 113, 0.1);
}

.code-output-close {
  background: transparent;
  border: none;
  color: #71717a;
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1;
  padding: 0.1rem 0.3rem;
  border-radius: 3px;
}

.code-output-close:hover {
  color: #ffffff;
  background: #181818;
}

.code-output-content {
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.5;
  color: #d4d4d8;
  max-height: 260px;
  overflow-y: auto;
  padding: 0.2rem 0;
}

.ansi-black { color: #52525b; }
.ansi-red { color: #f87171; }
.ansi-green { color: #4ade80; }
.ansi-yellow { color: #facc15; }
.ansi-blue { color: #60a5fa; }
.ansi-magenta { color: #c084fc; }
.ansi-cyan { color: #38bdf8; }
.ansi-white { color: #f4f4f5; }
.ansi-bold { font-weight: 700; }

.table-wrap {
  overflow-x: auto;
  margin: 1.5rem 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

th, td {
  padding: 0.65rem 0.85rem;
  border: 1px solid var(--border);
  text-align: left;
}

th {
  background: #050505;
  color: #ffffff;
  font-weight: 600;
}

tr:hover td {
  background: #040404;
}

.chapter-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 3.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  gap: 1rem;
}

.chapter-card {
  display: flex;
  flex-direction: column;
  padding: 0.85rem 1.15rem;
  background: #000000;
  border: 1px solid var(--border);
  border-radius: 6px;
  text-decoration: none;
  min-width: 180px;
  max-width: 260px;
  transition: all 0.15s ease;
}

.chapter-card:hover {
  border-color: var(--border-focus);
  background: #080808;
  transform: translateY(-1px);
}

.chapter-card-label {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  text-transform: uppercase;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  margin-bottom: 0.35rem;
}

.chapter-card-title {
  font-size: 0.9rem;
  font-weight: 600;
  color: #ffffff;
}

.chapter-card.next {
  margin-left: auto;
  text-align: right;
}

.toc-panel {
  width: var(--toc-w);
  flex-shrink: 0;
  position: fixed;
  top: var(--topbar-h);
  bottom: 0;
  right: 0;
  overflow-y: auto;
  padding: 2.5rem 1.5rem;
  border-left: 1px solid var(--border);
  background: #000000;
}

.toc-header {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 0.85rem;
}

.toc-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}

.toc-item a {
  display: block;
  font-size: 0.8rem;
  color: var(--text-dim);
  text-decoration: none;
  line-height: 1.4;
  transition: color 0.15s ease;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.toc-item a:hover {
  color: #ffffff;
}

.toc-item.active a {
  color: #ffffff;
  font-weight: 600;
}

.toc-item.sub {
  padding-left: 0.75rem;
  font-size: 0.75rem;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 45;
}

@media (max-width: 1240px) {
  .toc-panel {
    display: none;
  }
  .main-content {
    margin-right: 0;
  }
}

@media (max-width: 860px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .sidebar-overlay.open {
    display: block;
  }
  .main-content {
    margin-left: 0;
    padding: 2rem 1.5rem 5rem 1.5rem;
  }
  .menu-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .breadcrumb {
    display: none;
  }
}

@media (max-width: 480px) {
  .topbar {
    padding: 0 1rem;
  }
  .main-content {
    padding: 1.5rem 1rem 4rem 1rem;
  }
  .chapter-nav {
    flex-direction: column;
  }
  .chapter-card {
    max-width: 100%;
    width: 100%;
  }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <a href="/abyss" class="brand-link" aria-label="Abyss">
      <svg class="brand-logo" viewBox="230 250 2750 740">
        <defs>
          <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="1" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.16" />
          </filter>
          <style>
            .abyss-glyph, .abyss-text {
              fill: #05070a;
            }
            .abyss-text {
              font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
              font-size: 710px;
              font-weight: 900;
              letter-spacing: 20px;
            }
            @media (prefers-color-scheme: dark) {
              .abyss-glyph, .abyss-text {
                fill: #FDFCFD;
              }
            }
          </style>
        </defs>
        <g filter="url(#soft-shadow)">
          <g class="abyss-glyph">
            <polygon points="550.0,313.5 702.0,313.5 975.0,939.5 820.0,939.5 626.0,468.0 425.0,939.5 270.0,939.5" />
            <circle cx="626.0" cy="745.0" r="70.0" />
          </g>
          <text x="1060" y="939.5" class="abyss-text">BYSS</text>
        </g>
      </svg>
    </a>
    <div class="breadcrumb">
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-active" id="breadcrumb-title">Introduction</span>
    </div>
  </div>

  <div class="topbar-right">
    <a href="/abyss" class="topbar-btn">
      <span>Landing</span>
    </a>
    <a href="https://github.com/jhosein58/abyss" target="_blank" rel="noopener noreferrer" class="topbar-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      <span>GitHub</span>
    </a>
  </div>
</header>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="search-box">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="search-input" placeholder="Search chapters..." />
    </div>
    <div id="nav-container"></div>
  </aside>

  <main class="main-content">
    <article class="content-article">
      <div id="content-loading" class="doc-loader">
        <div class="doc-spinner"></div>

](03-the-guide/05-pointers-and-memory.md) — Direct memory addresses `&T`, seamless deep auto-dereference, and scoped arena allocations.\n- [06 - Comptime & Metaprogramming: The VM, Splices, and Reflection](03-the-guide/06-comptime-and-metaprogramming.md) — Bytecode VM evaluation with `cmpt`, string splices `#`, raw string templates, and compile-time reflection.\n- [07 - C Interoperability & Two-Way FFI](03-the-guide/07-c-interop.md) — Two-way C ABI, external function declarations, struct layout, and native header bindings.\n\n### Part IV: Standard Library Reference\nComprehensive, authoritative API documentation for the standard pods.\n- [01 - Core Primitives](04-reference/01-core.md) — Allocation-free `Str`, `Maybe(T)`, `Choice(T, E)`, `Slice(T)`, `Range`, and the zero-import prelude.\n- [02 - Collections](04-reference/02-collections.md) — High-performance contiguous data structures: `Vec(T)`, `HashMap(K, V)`, `HashSet(T)`, and `Worklist(T)`.\n- [03 - I/O & Formatting](04-reference/03-io-and-fmt.md) — Formatted console printing (`print`, `write`, `printf`), compile-time template engine `std/fmt`, and ANSI escapes.\n- [04 - Filesystem & Paths](04-reference/04-fs-and-path.md) — High-level `File` operations, `FileStream` stream I/O, and cross-platform `Path` manipulation.\n- [05 - Allocators & Memory](04-reference/05-allocators-and-mem.md) — Scoped `Arena` bump allocators, chunk management, and low-level `std/mem` heap primitives.\n- [06 - System & Native Threading](04-reference/06-sys-and-threading.md) — OS process controls, 1:1 native kernel threads (`std/thread`), value captures, and `Mutex(T)` synchronization.\n\n---\n\n> *\"Built for the deep.\"*\n", "docs/01-overview/philosophy.md": "# Philosophy\n\nAbyss is built on a simple premise: **you should understand what your machine is doing.**\n\nOver the last decade, mainstream languages have added layer upon layer of abstraction. Writing modern software sometimes feels like wearing three pairs of oven mitts just to pick up a coin: safe, perhaps, but clumsy and disconnected from reality.\n\nAbyss takes off the oven mitts. It pairs clean, modern syntax with the uncompromising transparency of C.\n\n---\n\n## 1. Mechanical Sympathy\n\nHardware is not an abstract mathematical canvas. It has L1/L2/L3 cache lines, branch predictors, registers, and memory buses. \n\nAbyss encourages data layout and code patterns that work *with* the hardware rather than fighting it. Linear memory arrays beat pointer-chasing linked lists every day of the week, and Abyss makes writing data-oriented code feel natural.\n\n## 2. No Garbage Collector\n\nA garbage collector is convenient—until it pauses your application to tidy up right in the middle of an audio buffer callback or a competitive game frame.\n\nAbyss has no garbage collector. You allocate memory when you need it, and you free it when you're done. Your latency remains completely deterministic from the first microsecond to the last.\n\n## 3. No Hidden Costs\n\nWhat you see in your source code is what actually executes on the processor:\n\n- **No hidden copy constructors** copying megabytes of memory behind your back.\n- **No implicit allocations** secretly calling `malloc` when you concatenate two values.\n- **No mysterious runtime daemons** managing threads or checking stacks.\n\nIf an operation takes memory or time, it is visible in the code.\n\n## 4. Modern Ergonomics, Low-Level Soul\n\nLow-level does not have to mean archaic. Abyss draws ergonomic inspiration from modern languages like Odin and Jai:\n\n- Clean type inference (`:=`).\n- First-class types that can be passed to and returned from functions.\n- Expressive compile-time evaluation (`cmpt`) powered by an integrated bytecode VM.\n- Functions without pointless boilerplate: if a function doesn't return anything, you don't need to specify a return type.\n\n## 5. Portability Through C99\n\nRather than dragging a multi-gigabyte compiler backend infrastructure into every installation, the Abyss compiler emits standard, portable ISO C99. \n\nAny platform with a working C compiler—whether it's a Linux server, a Windows desktop, an embedded ARM board, or a retro machine—can compile and run Abyss code at maximum optimization.\n\n---\n\n[Next: Architecture &rarr;](architecture.md)\n", "01-overview/philosophy.md": "# Philosophy\n\nAbyss is built on a simple premise: **you should understand what your machine is doing.**\n\nOver the last decade, mainstream languages have added layer upon layer of abstraction. Writing modern software sometimes feels like wearing three pairs of oven mitts just to pick up a coin: safe, perhaps, but clumsy and disconnected from reality.\n\nAbyss takes off the oven mitts. It pairs clean, modern syntax with the uncompromising transparency of C.\n\n---\n\n## 1. Mechanical Sympathy\n\nHardware is not an abstract mathematical canvas. It has L1/L2/L3 cache lines, branch predictors, registers, and memory buses. \n\nAbyss encourages data layout and code patterns that work *with* the hardware rather than fighting it. Linear memory arrays beat pointer-chasing linked lists every day of the week, and Abyss makes writing data-oriented code feel natural.\n\n## 2. No Garbage Collector\n\nA garbage collector is convenient—until it pauses your application to tidy up right in the middle of an audio buffer callback or a competitive game frame.\n\nAbyss has no garbage collector. You allocate memory when you need it, and you free it when you're done. Your latency remains completely deterministic from the first microsecond to the last.\n\n## 3. No Hidden Costs\n\nWhat you see in your source code is what actually executes on the processor:\n\n- **No hidden copy constructors** copying megabytes of memory behind your back.\n- **No implicit allocations** secretly calling `malloc` when you concatenate two values.\n- **No mysterious runtime daemons** managing threads or checking stacks.\n\nIf an operation takes memory or time, it is visible in the code.\n\n## 4. Modern Ergonomics, Low-Level Soul\n\nLow-level does not have to mean archaic. Abyss draws ergonomic inspiration from modern languages like Odin and Jai:\n\n- Clean type inference (`:=`).\n- First-class types that can be passed to and returned from functions.\n- Expressive compile-time evaluation (`cmpt`) powered by an integrated bytecode VM.\n- Functions without pointless boilerplate: if a function doesn't return anything, you don't need to specify a return type.\n\n## 5. Portability Through C99\n\nRather than dragging a multi-gigabyte compiler backend infrastructure into every installation, the Abyss compiler emits standard, portable ISO C99. \n\nAny platform with a working C compiler—whether it's a Linux server, a Windows desktop, an embedded ARM board, or a retro machine—can compile and run Abyss code at maximum optimization.\n\n---\n\n[Next: Architecture &rarr;](architecture.md)\n", "docs/01-overview/architecture.md": "# Architecture\n\nUnder the hood, Abyss is designed as a fast, deterministic pipeline with zero bloat. It rejects the modern trend of multi-gigabyte compiler toolchains that turn every build into an excuse to go grab coffee.\n\n---\n\n## The Dual-Engine Model\n\nTraditional compilers force a painful compromise: either you use a sluggish interpreter with instant startup, or an optimizing native compiler where you wait seconds (or minutes) for intermediate representations to optimize.\n\nAbyss includes **two coordinated execution engines** in a single binary:\n\n```\n                  ┌──────────────────────┐\n                  │  Abyss Source (.a)   │\n                  └──────────┬───────────┘\n                             │\n                  ┌──────────▼───────────┐\n                  │     DOP Compiler     │\n                  │ (Lex, Parse, Types)  │\n                  └──────────┬───────────┘\n                             │\n             ┌───────────────┴───────────────┐\n             │                               │\n    ┌────────▼────────┐             ┌────────▼────────┐\n    │   Bytecode VM   │             │   C99 Emitter   │\n    ├─────────────────┤             ├─────────────────┤\n    │ • Zero latency  │             │ • Portable C99  │\n    │ • Tests & dev   │             │ • Maximum -O3   │\n    │ • 'cmpt' blocks │             │ • GCC / Clang   │\n    └─────────────────┘             └─────────────────┘\n```\n\n1. **The Bytecode VM:**\n   The compiler can translate source directly into compact bytecode instructions and execute them instantly in-memory. This powers:\n   - Zero-latency test runs (`abyssc r main.a`).\n   - Compile-time evaluation (`cmpt { ... }`).\n   - Interactive developer workflows.\n\n2. **The C99 Emitter:**\n   When you need maximum throughput, Abyss emits pure ISO C99. This output contains no compiler-specific extensions (no GNU statement expressions or nested labels) and compiles cleanly with GCC, Clang, or MSVC. You get industry-standard native code optimization without carrying the weight of a heavy backend inside the language itself.\n\n---\n\n## Data-Oriented Compiler Core (DOP)\n\nMost classic compilers represent code as deeply nested, pointer-heavy Abstract Syntax Trees (ASTs). When traversing an AST, the CPU constantly stalls on cache misses, jumping randomly across the heap.\n\nThe Abyss compiler is architected around **Data-Oriented Programming (DOP)**:\n- Code nodes, types, and symbols are stored in **dense, linear tables**.\n- References are compact 32-bit integer IDs (`HirId`, `TyId`, `SymbolId`) rather than 64-bit heap pointers.\n- Traversal sweeps sequentially across contiguous memory, keeping CPU caches warm and parsing blazing fast.\n\n---\n\n## Self-Hosting & Fixed-Point Determinism\n\nAbyss is **100% self-hosted**. The compiler compiles itself:\n\n$$\\text{abyssc}_{G_1}(\\text{main.a}) \\rightarrow \\text{stage2.c} \\rightarrow \\text{abyssc}_{G_2}$$\n$$\\text{abyssc}_{G_2}(\\text{main.a}) \\rightarrow \\text{stage3.c} \\rightarrow \\text{abyssc}_{G_3}$$\n\nThe output of Generation 2 and Generation 3 is mathematically verified to be **bit-for-bit identical** ($G_2 \\equiv G_3$). There is no undefined behavior, no memory corruption, and no environmental noise leaking into the build.\n\n---\n\n## Zero-Dependency Bootstrap\n\nHow do you build a self-hosted compiler on a machine that doesn't have the compiler yet?\n\nAbyss solves the \"chicken-and-egg\" bootstrap problem cleanly. Every release packages `dist/bootstrap.c`—a single, standalone C99 source file containing the entire compiler.\n\nOn any machine with a basic C compiler:\n```sh\ncc -std=c99 -O3 -rdynamic dist/bootstrap.c -o abyssc\n```\n\nDone. No package managers, no downloading toolchains, no external libraries.\n\n---\n\n[Next: Whirlwind Tour &rarr;](../02-quickstart/whirlwind-tour.md)\n", "01-overview/architecture.md": "# Architecture\n\nUnder the hood, Abyss is designed as a fast, deterministic pipeline with zero bloat. It rejects the modern trend of multi-gigabyte compiler toolchains that turn every build into an excuse to go grab coffee.\n\n---\n\n## The Dual-Engine Model\n\nTraditional compilers force a painful compromise: either you use a sluggish interpreter with instant startup, or an optimizing native compiler where you wait seconds (or minutes) for intermediate representations to optimize.\n\nAbyss includes **two coordinated execution engines** in a single binary:\n\n```\n                  ┌──────────────────────┐\n                  │  Abyss Source (.a)   │\n                  └──────────┬───────────┘\n                             │\n                  ┌──────────▼───────────┐\n                  │     DOP Compiler     │\n                  │ (Lex, Parse, Types)  │\n                  └──────────┬───────────┘\n                             │\n             ┌───────────────┴───────────────┐\n             │                               │\n    ┌────────▼────────┐             ┌────────▼────────┐\n    │   Bytecode VM   │             │   C99 Emitter   │\n    ├─────────────────┤             ├─────────────────┤\n    │ • Zero latency  │             │ • Portable C99  │\n    │ • Tests & dev   │             │ • Maximum -O3   │\n    │ • 'cmpt' blocks │             │ • GCC / Clang   │\n    └─────────────────┘             └─────────────────┘\n```\n\n1. **The Bytecode VM:**\n   The compiler can translate source directly into compact bytecode instructions and execute them instantly in-memory. This powers:\n   - Zero-latency test runs (`abyssc r main.a`).\n   - Compile-time evaluation (`cmpt { ... }`).\n   - Interactive developer workflows.\n\n2. **The C99 Emitter:**\n   When you need maximum throughput, Abyss emits pure ISO C99. This output contains no compiler-specific extensions (no GNU statement expressions or nested labels) and compiles cleanly with GCC, Clang, or MSVC. You get industry-standard native code optimization without carrying the weight of a heavy backend inside the language itself.\n\n---\n\n## Data-Oriented Compiler Core (DOP)\n\nMost classic compilers represent code as deeply nested, pointer-heavy Abstract Syntax Trees (ASTs). When traversing an AST, the CPU constantly stalls on cache misses, jumping randomly across the heap.\n\nThe Abyss compiler is architected around **Data-Oriented Programming (DOP)**:\n- Code nodes, types, and symbols are stored in **dense, linear tables**.\n- References are compact 32-bit integer IDs (`HirId`, `TyId`, `SymbolId`) rather than 64-bit heap pointers.\n- Traversal sweeps sequentially across contiguous memory, keeping CPU caches warm and parsing blazing fast.\n\n---\n\n## Self-Hosting & Fixed-Point Determinism\n\nAbyss is **100% self-hosted**. The compiler compiles itself:\n\n$$\\text{abyssc}_{G_1}(\\text{main.a}) \\rightarrow \\text{stage2.c} \\rightarrow \\text{abyssc}_{G_2}$$\n$$\\text{abyssc}_{G_2}(\\text{main.a}) \\rightarrow \\text{stage3.c} \\rightarrow \\text{abyssc}_{G_3}$$\n\nThe output of Generation 2 and Generation 3 is mathematically verified to be **bit-for-bit identical** ($G_2 \\equiv G_3$). There is no undefined behavior, no memory corruption, and no environmental noise leaking into the build.\n\n---\n\n## Zero-Dependency Bootstrap\n\nHow do you build a self-hosted compiler on a machine that doesn't have the compiler yet?\n\nAbyss solves the \"chicken-and-egg\" bootstrap problem cleanly. Every release packages `dist/bootstrap.c`—a single, standalone C99 source file containing the entire compiler.\n\nOn any machine with a basic C compiler:\n```sh\ncc -std=c99 -O3 -rdynamic dist/bootstrap.c -o abyssc\n```\n\nDone. No package managers, no downloading toolchains, no external libraries.\n\n---\n\n[Next: Whirlwind Tour &rarr;](../02-quickstart/whirlwind-tour.md)\n", "docs/02-quickstart/whirlwind-tour.md": "# Whirlwind Tour\n\nThis tour will get you comfortable with Abyss syntax in less than ten minutes.\n\n---\n\n## 1. Hello, World!\n\nEvery Abyss program starts at `main`:\n\n```abyss\nmain :: fn() {\n    print(\"Hello from the deep!\")\n}\n```\n\nNotice anything missing? There is no `void` or `unit` keyword. If a function doesn't return anything, you simply don't write a return type. `print` automatically appends a newline (`\\n`). For custom compile-time formatted strings, `printf` is also available. \n\n---\n\n## 2. Variables & Comments\n\nComments start with `--`. Use `:=` for type inference, or specify types explicitly:\n\n```abyss\n-- This is a single-line comment\nx := 42                -- Inferred integer\npi: f32 = 3.14159      -- Explicit 32-bit float\nname := \"Abyss\"        -- Inferred string\nactive := true         -- Boolean\n\n-- Variables can be updated with '='\nx = x + 10\n```\n\nMutable variables can also be declared at module scope. Use `:=` with a compile-time constant initializer, or declare a type without an initializer to start at zero.\n\n```abyss\ninitial :: 10\nrequests := initial * 2\nfailures: u64\n\nrecord_failure :: fn() {\n    failures = failures + 1\n}\n```\n\nEach module has one instance of each global. Functions can read and update it, including through imports. A global's current value is a runtime value, so it cannot initialize another global or be read during compile-time evaluation. Taking the address of a global is allowed in an initializer because its storage is fixed.\n\n---\n\n## 3. Control Flow\n\n### `if` / `else`\nParentheses around conditions are optional, but braces around blocks are required:\n\n```abyss\ndepth := 500\n\nif depth > 1000 {\n    print(\"Crushing pressure!\")\n} else if depth > 200 {\n    print(\"The twilight zone.\")\n} else {\n    print(\"Near the surface.\")\n}\n```\n\n### Source locations and fatal errors\n\n`@source_location()` gives you a compile-time value with a file path, a line, and a byte column. Lines and columns start at 1. Use `#fall` to print the location of a fatal error to stderr and exit with status 1.\n\n```abyss\nfall :: @import(\"std/sys\").fall\n\ncheck_depth :: fn(depth i32) {\n    if depth < 0 { #fall }\n}\n```\n\n### `while`\nStraightforward loops without surprises. For formatted, newline-free printing, use `printf`:\n\n```abyss\nprintf :: @import(\"std/io\").printf\nprint :: @import(\"std/io\").print\n\ni := 0\nwhile i < 5 {\n    printf(\"{} \", .{i})\n    i = i + 1\n}\nprint(\"\")\n-- Outputs: 0 1 2 3 4\n```\n\n---\n\n## 4. Functions & Methods\n\nFunctions are declared with `:: fn(...) [ReturnType]`:\n\n```abyss\nprintf :: @import(\"std/io\").printf\n\nadd :: fn(a i32, b i32) i32 {\n    a + b\n}\n\nlog_depth :: fn(meters i32) {\n    printf(\"Current depth: {}m\\n\", .{meters})\n}\n```\n\nThe last expression in a block automatically acts as the return value—no explicit `return` keyword needed for simple expressions (though `ret` is available when you want an early exit).\n\n---\n\n## 5. Structs & Data Layout\n\nStructs define custom data types. Field definitions use `name Type` syntax (no colons between name and type):\n\n```abyss\nPoint :: struct {\n    x, y i32\n\n    -- Methods take 'self &Self' to access instance data\n    dist_sq :: fn(self &Self) i32 {\n        self.x * self.x + self.y * self.y\n    }\n}\n```\n\nInstantiating a struct is clean and expressive with struct literal syntax (`.{ ... }`). Combine with `printf` for zero-cost formatting:\n\n```abyss\np: Point = .{ x: 3, y: 4 }\nprintf(\"Point ({}, {}), dist_sq = {}\\n\", .{p.x, p.y, p.dist_sq()})\n-- Outputs: Point (3, 4), dist_sq = 25\n```\n\n---\n\n## 6. Tuples & Arrays\n\nAbyss supports structural tuples, destructuring, and fixed-size arrays with minimal syntax:\n\n```abyss\n-- Structural tuples and destructuring:\norigin := .{10, 20}\nx, y := origin\n\n-- Fixed-size arrays:\nnumbers: [3]i32 = .[1, 2, 3]\nprintf(\"Item: {}, origin: ({}, {})\\n\", .{numbers[0], x, y})\n```\n\n---\n\n## 7. Compile-Time Execution (`cmpt`)\n\nWhy calculate something at runtime when your CPU can do it once during compilation? \n\nThe `cmpt` block executes arbitrary code at compile time using the internal bytecode VM:\n\n```abyss\nTABLE_SIZE := cmpt {\n    base := 64\n    factor := 4\n    base * factor + 12\n}\n\nprint(TABLE_SIZE)\n-- TABLE_SIZE is baked into the binary as an exact constant (268)\n```\n\n---\n\n## 8. First-Class Types\n\nIn Abyss, types are first-class values. You can pass them as arguments, return them from functions, and choose them conditionally:\n\n```abyss\nPrecisionType :: fn(high_precision bool) type {\n    if high_precision { f64 } else { f32 }\n}\n\n-- Computes the type at compile-time without complex template metaprogramming\ncoordinate: PrecisionType(true) = 142.857\nprint(coordinate)\n```\n\nNo template error messages stretching across five terminal screens. Types are just code.\n\n## 9. Modules\n\nUse `@import` anywhere an expression is allowed. It takes a compile-time `Str`\nand returns a namespace struct for the file. Top-level bindings are available as\nmembers, including types, functions, constants, and mutable globals.\n\n```abyss\nstd :: @import(\"std\")\nArena :: @import(\"std/allocator\").Arena\n\nmain :: fn() {\n    fs := @import(\"std/fs\")\n    print(@type_name(fs.File))\n    print(std.ascii.is_digit('7'))\n}\n```\n\nUse `./` or `../` for paths relative to the importing file. Other paths resolve\nfrom the working directory and configured module search paths. The compiler\ntries `name.a` before `name/name.a`. Use an explicit `.a` to select a specific file.\n\nEach resolved file has one module identity per compilation. You can pass, store,\nor return its namespace value using `@typeof(@import(\"path\"))` as the type. Aliases\nshare the same definitions and mutable globals. Files can import each other and\nuse forward references; a binding whose value depends on itself is an error.\n\n---\n\n[Next: Tooling & Workflow &rarr;](workflow.md)\n", "02-quickstart/whirlwind-tour.md": "# Whirlwind Tour\n\nThis tour will get you comfortable with Abyss syntax in less than ten minutes.\n\n---\n\n## 1. Hello, World!\n\nEvery Abyss program starts at `main`:\n\n```abyss\nmain :: fn() {\n    print(\"Hello from the deep!\")\n}\n```\n\nNotice anything missing? There is no `void` or `unit` keyword. If a function doesn't return anything, you simply don't write a return type. `print` automatically appends a newline (`\\n`). For custom compile-time formatted strings, `printf` is also available. \n\n---\n\n## 2. Variables & Comments\n\nComments start with `--`. Use `:=` for type inference, or specify types explicitly:\n\n```abyss\n-- This is a single-line comment\nx := 42                -- Inferred integer\npi: f32 = 3.14159      -- Explicit 32-bit float\nname := \"Abyss\"        -- Inferred string\nactive := true         -- Boolean\n\n-- Variables can be updated with '='\nx = x + 10\n```\n\nMutable variables can also be declared at module scope. Use `:=` with a compile-time constant initializer, or declare a type without an initializer to start at zero.\n\n```abyss\ninitial :: 10\nrequests := initial * 2\nfailures: u64\n\nrecord_failure :: fn() {\n    failures = failures + 1\n}\n```\n\nEach module has one instance of each global. Functions can read and update it, including through imports. A global's current value is a runtime value, so it cannot initialize another global or be read during compile-time evaluation. Taking the address of a global is allowed in an initializer because its storage is fixed.\n\n---\n\n## 3. Control Flow\n\n### `if` / `else`\nParentheses around conditions are optional, but braces around blocks are required:\n\n```abyss\ndepth := 500\n\nif depth > 1000 {\n    print(\"Crushing pressure!\")\n} else if depth > 200 {\n    print(\"The twilight zone.\")\n} else {\n    print(\"Near the surface.\")\n}\n```\n\n### Source locations and fatal errors\n\n`@source_location()` gives you a compile-time value with a file path, a line, and a byte column. Lines and columns start at 1. Use `#fall` to print the location of a fatal error to stderr and exit with status 1.\n\n```abyss\nfall :: @import(\"std/sys\").fall\n\ncheck_depth :: fn(depth i32) {\n    if depth < 0 { #fall }\n}\n```\n\n### `while`\nStraightforward loops without surprises. For formatted, newline-free printing, use `printf`:\n\n```abyss\nprintf :: @import(\"std/io\").printf\nprint :: @import(\"std/io\").print\n\ni := 0\nwhile i < 5 {\n    printf(\"{} \", .{i})\n    i = i + 1\n}\nprint(\"\")\n-- Outputs: 0 1 2 3 4\n```\n\n---\n\n## 4. Functions & Methods\n\nFunctions are declared with `:: fn(...) [ReturnType]`:\n\n```abyss\nprintf :: @import(\"std/io\").printf\n\nadd :: fn(a i32, b i32) i32 {\n    a + b\n}\n\nlog_depth :: fn(meters i32) {\n    printf(\"Current depth: {}m\\n\", .{meters})\n}\n```\n\nThe last expression in a block automatically acts as the return value—no explicit `return` keyword needed for simple expressions (though `ret` is available when you want an early exit).\n\n---\n\n## 5. Structs & Data Layout\n\nStructs define custom data types. Field definitions use `name Type` syntax (no colons between name and type):\n\n```abyss\nPoint :: struct {\n    x, y i32\n\n    -- Methods take 'self &Self' to access instance data\n    dist_sq :: fn(self &Self) i32 {\n        self.x * self.x + self.y * self.y\n    }\n}\n```\n\nInstantiating a struct is clean and expressive with struct literal syntax (`.{ ... }`). Combine with `printf` for zero-cost formatting:\n\n```abyss\np: Point = .{ x: 3, y: 4 }\nprintf(\"Point ({}, {}), dist_sq = {}\\n\", .{p.x, p.y, p.dist_sq()})\n-- Outputs: Point (3, 4), dist_sq = 25\n```\n\n---\n\n## 6. Tuples & Arrays\n\nAbyss supports structural tuples, destructuring, and fixed-size arrays with minimal syntax:\n\n```abyss\n-- Structural tuples and destructuring:\norigin := .{10, 20}\nx, y := origin\n\n-- Fixed-size arrays:\nnumbers: [3]i32 = .[1, 2, 3]\nprintf(\"Item: {}, origin: ({}, {})\\n\", .{numbers[0], x, y})\n```\n\n---\n\n## 7. Compile-Time Execution (`cmpt`)\n\nWhy calculate something at runtime when your CPU can do it once during compilation? \n\nThe `cmpt` block executes arbitrary code at compile time using the internal bytecode VM:\n\n```abyss\nTABLE_SIZE := cmpt {\n    base := 64\n    factor := 4\n    base * factor + 12\n}\n\nprint(TABLE_SIZE)\n-- TABLE_SIZE is baked into the binary as an exact constant (268)\n```\n\n---\n\n## 8. First-Class Types\n\nIn Abyss, types are first-class values. You can pass them as arguments, return them from functions, and choose them conditionally:\n\n```abyss\nPrecisionType :: fn(high_precision bool) type {\n    if high_precision { f64 } else { f32 }\n}\n\n-- Computes the type at compile-time without complex template metaprogramming\ncoordinate: PrecisionType(true) = 142.857\nprint(coordinate)\n```\n\nNo template error messages stretching across five terminal screens. Types are just code.\n\n## 9. Modules\n\nUse `@import` anywhere an expression is allowed. It takes a compile-time `Str`\nand returns a namespace struct for the file. Top-level bindings are available as\nmembers, including types, functions, constants, and mutable globals.\n\n```abyss\nstd :: @import(\"std\")\nArena :: @import(\"std/allocator\").Arena\n\nmain :: fn() {\n    fs := @import(\"std/fs\")\n    print(@type_name(fs.File))\n    print(std.ascii.is_digit('7'))\n}\n```\n\nUse `./` or `../` for paths relative to the importing file. Other paths resolve\nfrom the working directory and configured module search paths. The compiler\ntries `name.a` before `name/name.a`. Use an explicit `.a` to select a specific file.\n\nEach resolved file has one module identity per compilation. You can pass, store,\nor return its namespace value using `@typeof(@import(\"path\"))` as the type. Aliases\nshare the same definitions and mutable globals. Files can import each other and\nuse forward references; a binding whose value depends on itself is an error.\n\n---\n\n[Next: Tooling & Workflow &rarr;](workflow.md)\n", "docs/02-quickstart/workflow.md": "# Tooling & Workflow: `abyssc`, `sonar`, and `abyssfmt`\n\nAbyss provides a streamlined, three-tool ecosystem installed directly into your environment:\n1. **`abyssc`**: The core Abyss compiler, featuring an instant-execution Bytecode VM and an optimizing C99 native emitter.\n2. **`sonar`**: The official package manager and build system for managing dependencies, compiling pods, and running tests.\n3. **`abyssfmt`**: The canonical source code formatter enforcing clean, readable Abyss style.\n\n---\n\n## 1. Installation\n\nYou can install the complete Abyss toolchain with a single command:\n\n### Linux & macOS (Bash)\n\n```sh\ncurl -fsSL https://raw.githubusercontent.com/abysslang/abyss/main/scripts/install.sh | bash\n```\n\nThe installer downloads the latest pre-built toolchain, extracts `abyssc`, `sonar`, and `abyssfmt` to `~/.abyss/bin`, and automatically adds them to your shell's `PATH`.\n\n### Windows (PowerShell)\n\nOpen PowerShell and run:\n\n```powershell\nirm https://raw.githubusercontent.com/abysslang/abyss/main/scripts/install.ps1 | iex\n```\n\n### Verifying the Installation\n\nOpen a new terminal session and verify that the tools are available:\n\n```sh\nabyssc --version\nsonar help\nabyssfmt --help\n```\n\n---\n\n## 2. The Fast Loop: Run Instantly with `abyssc`\n\nDuring active development, waiting for a native C compiler and linker adds unnecessary friction. Use the Bytecode VM for instantaneous turnaround:\n\n```sh\nabyssc r main.a\n```\n\nThe compiler parses your code, verifies types, translates AST nodes into compact bytecode instructions, and executes them immediately in memory. Zero disk clutter, zero linker latency.\n\n---\n\n## 3. The Native Loop: Optimized C99 Binaries\n\nWhen you need peak execution performance, use `abyssc` to emit portable ISO C99:\n\n```sh\n# Emit optimized C99 source code\nabyssc b main.a out.c\n\n# Compile with your C compiler of choice (GCC or Clang)\ngcc -std=gnu99 -D_POSIX_C_SOURCE=200809L -O3 out.c -o my_program\n./my_program\n```\n\n### Cross-Compilation Targets\n\n`abyssc` includes built-in multi-target support. Use `--target` and `--arch` to select the target platform:\n\n```sh\n# Cross-compile to WebAssembly (WASI)\nabyssc b --target wasi --arch wasm32 main.a program.c\nclang --target=wasm32-wasi -ffreestanding -nostdlib program.c -o program.wasm\n\n# Cross-compile for Windows from Linux\nabyssc b --target windows --arch x86_64 main.a program.c\nx86_64-w64-mingw32-gcc -O3 program.c -o program.exe\n```\n\nSupported operating systems: `linux`, `windows`, `darwin`, `wasi`, `freestanding`.  \nSupported architectures: `x86_64`, `aarch64`, `wasm32`.\n\n---\n\n## 4. Project & Package Management with `sonar`\n\nFor multi-file applications and packages (called **Pods** in Abyss), use `sonar`:\n\n### Initializing a New Pod\n\n```sh\nsonar init my-app\ncd my-app\n```\n\nThis creates a `pod.json` manifest specifying the pod name, version, entry point, dependencies, and native C build options:\n\n```json\n{\n  \"name\": \"my-app\",\n  \"version\": \"0.1.0\",\n  \"entry\": \"main.a\",\n  \"dependencies\": {},\n  \"c_build\": {\n    \"sources\": [],\n    \"include_dirs\": [],\n    \"c_flags\": [],\n    \"ld_flags\": []\n  }\n}\n```\n\n### Building and Running Projects\n\n```sh\n# Build and run the project binary in one command\nsonar run\n\n# Build the release binary into the current directory\nsonar build\n```\n\n### Managing Dependencies\n\n```sh\n# Add a dependency from the central index\nsonar add json\n\n# Update local index and download dependencies into .vendor/\nsonar update\nsonar vendor\n```\n\n### Running Unit Tests\n\nSonar automatically discovers and executes all test suites defined within the pod:\n\n```sh\nsonar test\n```\n\n---\n\n## 5. Canonical Formatting with `abyssfmt`\n\nCode formatting in Abyss is canonical. Rather than arguing over style, run `abyssfmt` to format files in-place:\n\n```sh\n# Format a single file\nabyssfmt main.a\n\n# Format an entire source directory\nabyssfmt src/\n```\n\n### Formatting Rules Enforced:\n- 4-space indentation (tabs are rejected).\n- Statement separation via clean newlines (no trailing semicolons).\n- Clean vertical layout for multiline struct and array literals.\n\n---\n\n[Next Part: The Guide &rarr;](../03-the-guide/01-basics.md)\n", "02-quickstart/workflow.md": "# Tooling & Workflow: `abyssc`, `sonar`, and `abyssfmt`\n\nAbyss provides a streamlined, three-tool ecosystem installed directly into your environment:\n1. **`abyssc`**: The core Abyss compiler, featuring an instant-execution Bytecode VM and an optimizing C99 native emitter.\n2. **`sonar`**: The official package manager and build system for managing dependencies, compiling pods, and running tests.\n3. **`abyssfmt`**: The canonical source code formatter enforcing clean, readable Abyss style.\n\n---\n\n## 1. Installation\n\nYou can install the complete Abyss toolchain with a single command:\n\n### Linux & macOS (Bash)\n\n```sh\ncurl -fsSL https://raw.githubusercontent.com/abysslang/abyss/main/scripts/install.sh | bash\n```\n\nThe installer downloads the latest pre-built toolchain, extracts `abyssc`, `sonar`, and `abyssfmt` to `~/.abyss/bin`, and automatically adds them to your shell's `PATH`.\n\n### Windows (PowerShell)\n\nOpen PowerShell and run:\n\n```powershell\nirm https://raw.githubusercontent.com/abysslang/abyss/main/scripts/install.ps1 | iex\n```\n\n### Verifying the Installation\n\nOpen a new terminal session and verify that the tools are available:\n\n```sh\nabyssc --version\nsonar help\nabyssfmt --help\n```\n\n---\n\n## 2. The Fast Loop: Run Instantly with `abyssc`\n\nDuring active development, waiting for a native C compiler and linker adds unnecessary friction. Use the Bytecode VM for instantaneous turnaround:\n\n```sh\nabyssc r main.a\n```\n\nThe compiler parses your code, verifies types, translates AST nodes into compact bytecode instructions, and executes them immediately in memory. Zero disk clutter, zero linker latency.\n\n---\n\n## 3. The Native Loop: Optimized C99 Binaries\n\nWhen you need peak execution performance, use `abyssc` to emit portable ISO C99:\n\n```sh\n# Emit optimized C99 source code\nabyssc b main.a out.c\n\n# Compile with your C compiler of choice (GCC or Clang)\ngcc -std=gnu99 -D_POSIX_C_SOURCE=200809L -O3 out.c -o my_program\n./my_program\n```\n\n### Cross-Compilation Targets\n\n`abyssc` includes built-in multi-target support. Use `--target` and `--arch` to select the target platform:\n\n```sh\n# Cross-compile to WebAssembly (WASI)\nabyssc b --target wasi --arch wasm32 main.a program.c\nclang --target=wasm32-wasi -ffreestanding -nostdlib program.c -o program.wasm\n\n# Cross-compile for Windows from Linux\nabyssc b --target windows --arch x86_64 main.a program.c\nx86_64-w64-mingw32-gcc -O3 program.c -o program.exe\n```\n\nSupported operating systems: `linux`, `windows`, `darwin`, `wasi`, `freestanding`.  \nSupported architectures: `x86_64`, `aarch64`, `wasm32`.\n\n---\n\n## 4. Project & Package Management with `sonar`\n\nFor multi-file applications and packages (called **Pods** in Abyss), use `sonar`:\n\n### Initializing a New Pod\n\n```sh\nsonar init my-app\ncd my-app\n```\n\nThis creates a `pod.json` manifest specifying the pod name, version, entry point, dependencies, and native C build options:\n\n```json\n{\n  \"name\": \"my-app\",\n  \"version\": \"0.1.0\",\n  \"entry\": \"main.a\",\n  \"dependencies\": {},\n  \"c_build\": {\n    \"sources\": [],\n    \"include_dirs\": [],\n    \"c_flags\": [],\n    \"ld_flags\": []\n  }\n}\n```\n\n### Building and Running Projects\n\n```sh\n# Build and run the project binary in one command\nsonar run\n\n# Build the release binary into the current directory\nsonar build\n```\n\n### Managing Dependencies\n\n```sh\n# Add a dependency from the central index\nsonar add json\n\n# Update local index and download dependencies into .vendor/\nsonar update\nsonar vendor\n```\n\n### Running Unit Tests\n\nSonar automatically discovers and executes all test suites defined within the pod:\n\n```sh\nsonar test\n```\n\n---\n\n## 5. Canonical Formatting with `abyssfmt`\n\nCode formatting in Abyss is canonical. Rather than arguing over style, run `abyssfmt` to format files in-place:\n\n```sh\n# Format a single file\nabyssfmt main.a\n\n# Format an entire source directory\nabyssfmt src/\n```\n\n### Formatting Rules Enforced:\n- 4-space indentation (tabs are rejected).\n- Statement separation via clean newlines (no trailing semicolons).\n- Clean vertical layout for multiline struct and array literals.\n\n---\n\n[Next Part: The Guide &rarr;](../03-the-guide/01-basics.md)\n", "docs/03-the-guide/01-basics.md": "# Basics: Variables, Types, and Expressions\n\nAbyss is an expression-oriented systems programming language. It combines the raw control and transparency of C with clean, modern syntax and bidirectional type inference.\n\nLet's begin with a complete, minimal program:\n\n```abyss\nmain :: fn() {\n    x := 42\n    pi: f64 = 3.14159\n    greeting := \"Hello from the deep!\"\n\n    print(greeting)\n    print(x)\n}\n```\n\nSave this as `basics.a` and run it instantly with the bytecode VM:\n\n```sh\nabyssc r basics.a\n```\n\n---\n\n## 1. Variables and Bindings\n\nIn Abyss, local variables are declared using the short-declaration operator `:=`. The compiler automatically infers the type from the right-hand value:\n\n```abyss\ncount := 10             -- Inferred as i32\nratio := 0.75           -- Inferred as f64\nis_valid := true        -- Inferred as bool\nmessage := \"Ready\"      -- Inferred as Str\n```\n\n### Explicit Type Annotations\n\nWhen you want an exact type rather than the inferred default, provide an explicit type annotation using `: Type =`:\n\n```abyss\nsmall_id: u8 = 255\nhuge_counter: u64 = 10000000000\nprecise_float: f32 = 1.4142135\n```\n\n### Reassignment and Mutability\n\nLocal variables are mutable by default. You can update their value at any time with `=`:\n\n```abyss\nscore := 100\nscore = score + 50\nscore = score * 2\n```\n\n### Module-Level Variables\n\nVariables can also be declared at the module level. You can give them a compile-time initial value or omit the initializer to start zeroed:\n\n```abyss\ndefault_port :: 8080\nactive_connections := 0\ntotal_bytes_served: u64\n\nregister_connection :: fn() {\n    active_connections = active_connections + 1\n}\n```\n\nEach module has a single global instance of its module variables. Their addresses are fixed and stable across the lifetime of the program.\n\n---\n\n## 2. Compile-Time Constants (`::`)\n\nConstants are declared with double colons `::`. Constants are evaluated strictly at compile time and have zero runtime footprint:\n\n```abyss\nMAX_BUFFER_SIZE :: 4096\nPI :: 3.141592653589793\nAPP_NAME :: \"Abyss Engine\"\n```\n\nBecause constants are resolved by the compiler, you can use them anywhere a constant value or type expression is expected, such as array sizes or memory limits.\n\n---\n\n## 3. Primitive Types\n\nAbyss gives you direct, fixed-width numeric types matching standard hardware sizes:\n\n### Integers\n\n| Type | Bits | Kind | Range |\n| :--- | :--- | :--- | :--- |\n| `i8` | 8 | Signed | $-128$ to $127$ |\n| `i16` | 16 | Signed | $-32,768$ to $32,767$ |\n| `i32` | 32 | Signed | $-2,147,483,648$ to $2,147,483,647$ |\n| `i64` | 64 | Signed | $-9.22 \\times 10^{18}$ to $9.22 \\times 10^{18}$ |\n| `i128` | 128 | Signed | 128-bit signed integer |\n| `u8` | 8 | Unsigned | $0$ to $255$ |\n| `u16` | 16 | Unsigned | $0$ to $65,535$ |\n| `u32` | 32 | Unsigned | $0$ to $4,294,967,295$ |\n| `u64` | 64 | Unsigned | $0$ to $1.84 \\times 10^{19}$ |\n| `u128` | 128 | Unsigned | 128-bit unsigned integer |\n\nInteger literals without suffixes default to `i32` unless constrained by context.\n\n### Floating-Point Numbers\n\n- `f32`: Single-precision 32-bit IEEE 754 float.\n- `f64`: Double-precision 64-bit IEEE 754 float (default for floating-point literals).\n\n### Booleans\n\nThe `bool` type has two values: `true` and `false`. Booleans are strictly typed and do not implicitly convert to integers:\n\n```abyss\nis_active: bool = true\nis_done := false\n```\n\n### Characters\n\nAbyss does not have a distinct `char` primitive type. Character literals enclosed in single quotes `'a'`, `'Z'`, `'\\n'` are compile-time integer literals:\n\n```abyss\nnewline := '\\n'         -- Untyped integer literal\nascii_code: u8 = 'A'   -- Coerces seamlessly to u8 (value 65)\noffset: i32 = '0'       -- Coerces seamlessly to i32 (value 48)\n```\n\n---\n\n## 4. Operators and Arithmetic\n\nAbyss supports the standard suite of arithmetic, bitwise, and comparison operators:\n\n### Arithmetic Operators\n```abyss\nsum := 10 + 5           -- Addition (15)\ndiff := 20 - 4          -- Subtraction (16)\nprod := 6 * 7           -- Multiplication (42)\nquot := 40 / 8          -- Division (5)\nrem := 14 % 3           -- Remainder (2)\n```\n\n### Bitwise Operators\n```abyss\na := 0b1100\nb := 0b1010\n\nand_res := a & b        -- Bitwise AND (0b1000)\nor_res  := a | b        -- Bitwise OR  (0b1110)\nxor_res := a ^ b        -- Bitwise XOR (0b0110)\nshl_res := a << 2       -- Shift left  (0b110000)\nshr_res := a >> 1       -- Shift right (0b0110)\nnot_res := ~a           -- Bitwise NOT\n```\n\n### Comparison Operators\n```abyss\nequal := (a == b)\nnot_eq := (a != b)\nless := (a < b)\ngreater := (a > b)\nless_eq := (a <= b)\ngreater_eq := (a >= b)\n```\n\n### Logical Operators\nAbyss uses readable keyword operators for boolean logic with full short-circuit evaluation:\n\n```abyss\nif has_permission and is_admin {\n    print(\"Access granted\")\n}\n\nif is_cached or load_from_disk() {\n    print(\"Data available\")\n}\n\nif not is_connected {\n    print(\"Offline\")\n}\n```\n\n---\n\n## 5. Expressions and Sequencing\n\nAbyss is an expression-oriented language. Blocks wrapped in braces `{ ... }` evaluate to their final expression:\n\n```abyss\nresult := {\n    step1 := 10 * 2\n    step2 := step1 + 5\n    step2 * 3           -- The block evaluates to 75\n}\n```\n\n### No Semicolons\n\nAbyss source code does not use semicolons. Statements and declarations are separated by **newlines**:\n\n```abyss\na := 10\nb := 20\nc := a + b\n```\n\nIf you wish to sequence multiple expressions on the same line, use a **comma** `,`:\n\n```abyss\nval := { a := 2, b := 4, a + b }\nprint(1), print(2), print(3)\n```\n\n### Comments\n\nComments are strictly single-line and begin with `--`:\n\n```abyss\n-- This is a comment\nx := 100 -- Comments can follow any statement\n```\n\n*(Double-slash `//` is not valid Abyss syntax.)*\n\n---\n\n## 6. Strings: `Str` vs `c\"...\"`\n\nIn Abyss, text is represented by the `Str` slice structure, provided automatically by the standard prelude without any imports:\n\n```abyss\nStr :: struct {\n    ptr &u8\n    len u64\n}\n```\n\nA standard string literal `\"...\"` always produces a `Str`. It holds a pointer to the UTF-8 bytes and an explicit 64-bit length:\n\n```abyss\ngreeting := \"Hello, Abyss!\"\nlength := greeting.len  -- 13\n```\n\nBecause `Str` tracks its own length, determining string length is an instant $O(1)$ operation, and strings can safely contain embedded null bytes.\n\n### C Strings (`c\"...\"`)\n\nWhen interfacing with external C libraries or system APIs that expect null-terminated C strings, use `c\"...\"`:\n\n```abyss\nc_str := c\"null-terminated string\"  -- Produces &u8\n```\n\nYou can convert a C string to an Abyss `Str` at any time using `Str.of`:\n\n```abyss\nstr_view := Str.of(c_str)\n```\n\n---\n\n## Idiomatic Summary\n\n| Concept | Idiomatic Abyss | Anti-Pattern |\n| :--- | :--- | :--- |\n| **Local Variables** | `x := 42` | `var x: i32 = 42;` |\n| **Constants** | `LIMIT :: 100` | `const LIMIT = 100;` |\n| **Comments** | `-- comment` | `// comment` or `/* */` |\n| **String Type** | `name: Str` | `name: &u8` (unless C FFI) |\n| **Sequencing** | Newlines or `,` | Semicolons `;` |\n\n---\n\n[← Previous: Tooling & Workflow](../02-quickstart/workflow.md) | [Next: Control Flow →](02-control-flow.md)\n", "03-the-guide/01-basics.md": "# Basics: Variables, Types, and Expressions\n\nAbyss is an expression-oriented systems programming language. It combines the raw control and transparency of C with clean, modern syntax and bidirectional type inference.\n\nLet's begin with a complete, minimal program:\n\n```abyss\nmain :: fn() {\n    x := 42\n    pi: f64 = 3.14159\n    greeting := \"Hello from the deep!\"\n\n    print(greeting)\n    print(x)\n}\n```\n\nSave this as `basics.a` and run it instantly with the bytecode VM:\n\n```sh\nabyssc r basics.a\n```\n\n---\n\n## 1. Variables and Bindings\n\nIn Abyss, local variables are declared using the short-declaration operator `:=`. The compiler automatically infers the type from the right-hand value:\n\n```abyss\ncount := 10             -- Inferred as i32\nratio := 0.75           -- Inferred as f64\nis_valid := true        -- Inferred as bool\nmessage := \"Ready\"      -- Inferred as Str\n```\n\n### Explicit Type Annotations\n\nWhen you want an exact type rather than the inferred default, provide an expli
